<title>Stock Upside Weekly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: an analyst tear sheet. Funnel summary on top, then a ruled ledger of names with scenario bars drawn to one shared scale. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --sunk: #eaeef3; --fg: #13202c; --muted: #5a6a7b; --line: #d9e0e8;
  --accent: #1d5bbf; --accent-soft: #e3ecfa; --up: #11805b; --down: #c0392b; --warn: #9a6300; --warn-soft: #fbf0d9;
  --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d131a; --surface: #141c25; --sunk: #1a2430; --fg: #e5ecf3; --muted: #93a3b4; --line: #26323f;
  --accent: #74a6ff; --accent-soft: #1b2a42; --up: #3fcf8e; --down: #ff7b6c; --warn: #e2a63c; --warn-soft: #2e2512; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d131a; --surface: #141c25; --sunk: #1a2430; --fg: #e5ecf3; --muted: #93a3b4; --line: #26323f;
  --accent: #74a6ff; --accent-soft: #1b2a42; --up: #3fcf8e; --down: #ff7b6c; --warn: #e2a63c; --warn-soft: #2e2512; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px; display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 14px; font-weight: 700; }
.eyebrow { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
html { accent-color: var(--accent); scrollbar-color: var(--line) transparent; }
::selection { background: var(--accent-soft); color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.wrap { grid-template-columns: minmax(0, 1fr); }
.wrap > *, .panel > * { min-width: 0; }
.panel { grid-template-columns: minmax(0, 1fr); }
header { display: grid; gap: 10px; }
.titlerow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
.asof { font-size: 12.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.meta { color: var(--muted); max-width: 72ch; margin: 0; }
.note { font-size: 12.5px; color: var(--muted); }
.disclaimer { font-size: 12.5px; color: var(--warn); margin: 0; display: flex; gap: 6px; align-items: flex-start; }
.disclaimer svg { margin-top: 2px; }
.disclaimer svg { flex: none; }
.pipe { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; font-size: 13px; color: var(--muted); padding-block: 10px; border-block: 1px solid var(--line); }
.pipe b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.pipe .side { color: var(--muted); }
.pipe svg { color: var(--line); flex: none; }
.hl { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.hl button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 4px; align-content: start; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; transition: border-color .15s, box-shadow .15s; }
.hl button:hover { border-color: var(--accent); box-shadow: 0 2px 10px -4px color-mix(in srgb, var(--accent) 35%, transparent); }
.hl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hl .k { font-size: 12px; color: var(--muted); }
.hl .v { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.hl .v b { font-family: var(--display); font-size: 20px; font-weight: 700; }
.hl .n { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hl .basis-tag { font-size: 11px; color: var(--muted); }
@media (max-width: 900px) { .hl { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { font: 600 13.5px var(--body); background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 10px 12px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--accent); }
.tabs button:focus-visible, .controls :focus-visible, tr.row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.controls label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.controls input, .controls select { font: 14px var(--body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
#q { width: 220px; max-width: 70vw; } #minret { width: 90px; }
.panel { display: grid; gap: 12px; }
.basis { font-size: 13px; color: var(--muted); max-width: 90ch; }
.basis strong { color: var(--fg); }
.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--sunk); position: sticky; top: 0; }
th.l, td.l { text-align: left; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--sunk); }
tr.open td { background: var(--accent-soft); }
.co { display: grid; line-height: 1.25; min-width: 20ch; }
.co b { font-weight: 600; }
.co small { color: var(--muted); font-size: 12px; max-width: 26ch; overflow: hidden; text-overflow: ellipsis; }
.pos { color: var(--up); } .neg { color: var(--down); } .na { color: var(--muted); }
.chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--sunk); color: var(--muted); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.bar { width: 170px; height: 22px; display: block; }
.detail td { background: var(--bg); white-space: normal; text-align: left; padding: 18px 16px; }
.dgrid { display: grid; gap: 18px; max-width: 1100px; position: sticky; left: 16px; box-sizing: border-box; }
.cases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.case { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.case .t { font-family: var(--display); font-size: 20px; font-weight: 700; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.hist { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.hist th, .hist td { font-size: 12.5px; padding: 6px 8px; }
.srcs { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.mix { display: grid; gap: 6px; max-width: 320px; margin-top: 4px; }
.mix .lbl { display: flex; justify-content: space-between; font-size: 12px; }
.mix .lbl b { font-weight: 600; }
.segs { display: flex; gap: 2px; }
.segs i { flex: 1; height: 8px; border-radius: 2px; background: var(--sunk); }
.pill { display: inline-block; white-space: nowrap; padding: 2px 7px; border-radius: 5px; font-weight: 600; }
.pill.pos { background: color-mix(in srgb, var(--up) 14%, transparent); }
.pill.neg { background: color-mix(in srgb, var(--down) 14%, transparent); }
th.sort { cursor: pointer; user-select: none; }
th.sort:hover { color: var(--fg); }
th.sort[aria-sort] { color: var(--accent); }
th.sort:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.strip { width: 150px; height: 26px; display: block; }
.strip.wide { width: 100%; max-width: 420px; height: 46px; }
.act { display: inline-flex; align-items: center; gap: 6px; }
.act i { font-style: normal; width: 20px; height: 20px; border-radius: 5px; display: inline-grid; place-items: center; background: var(--sunk); color: var(--muted); }
.act i.up { color: var(--up); background: color-mix(in srgb, var(--up) 12%, transparent); }
.act i.dn { color: var(--down); background: color-mix(in srgb, var(--down) 12%, transparent); }
.mlist { display: none; list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.mlist > li + li { border-top: 1px solid var(--line); }
.mrow { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 12px 14px; }
.mrow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.mrow[aria-expanded="true"] { background: var(--accent-soft); }
.mrow .rk { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.mrow .sub { grid-column: 2 / 4; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.mrow .co small { max-width: none; }
.mrow .sub > span:last-child { white-space: nowrap; }
.mrow .sub .strip { width: 110px; }
.mrow .sub .bar { width: 120px; }
.mdetail { padding: 14px; background: var(--bg); border-top: 1px solid var(--line); }
.mdetail .dgrid { position: static; width: auto !important; }
.dgrid { grid-template-columns: minmax(0, 1fr); }
.dgrid > *, .two > *, .mlist > li { min-width: 0; }
.mdetail .two .kv { grid-template-columns: minmax(0, 1fr); }
.mdetail .kv dt { margin-top: 6px; font-size: 12px; }
@media (max-width: 720px) {
  .tablebox.desk { display: none; }
  .mlist { display: block; }
  .controls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .controls label:first-child { grid-column: 1 / -1; }
  #q { width: 100%; max-width: none; } #minret { width: 100%; }
}
tr.divider td { background: var(--sunk); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: left; }
details.wait { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
details.wait summary { cursor: pointer; font-weight: 600; }
.symlist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chg { display: grid; gap: 12px; }
.chg-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.chg-head p { margin: 0; color: var(--muted); font-size: 13px; }
.chg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 10px; align-items: start; }
.blk { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.blk h3 { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.blk h3 .chip { font-family: var(--body); }
.blk ul { list-style: none; margin: 0; padding: 0; }
.blk li + li { border-top: 1px solid var(--line); }
.crow { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 14px; font-size: 13px; }
.crow:hover { background: var(--sunk); }
.crow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.crow > b { font-weight: 600; }
.crow .d { min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow .d strong { color: var(--fg); font-weight: 500; }
.crow .val { font-variant-numeric: tabular-nums; white-space: nowrap; }
.blk details > summary { cursor: pointer; padding: 8px 14px; font-size: 12.5px; color: var(--accent); border-top: 1px solid var(--line); list-style: none; }
.blk details > summary::-webkit-details-marker { display: none; }
.blk details[open] > summary { display: none; }
.blk .none { padding: 10px 14px; font-size: 13px; color: var(--muted); margin: 0; }
@media (max-width: 720px) { .crow .d { white-space: normal; } }
footer { display: grid; gap: 8px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; max-width: 95ch; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
@media (max-width: 760px) { .cases, .two { grid-template-columns: minmax(0, 1fr); } .bar { width: 120px; } }
@media (prefers-reduced-motion: no-preference) { tr.row td { transition: background .12s; } }
</style>

<div class="wrap">
  <header>
    <div class="titlerow"><h1>Stock Upside Weekly</h1><span class="asof" id="asof"></span></div>
    <p class="meta" id="meta"></p>
    <p class="disclaimer"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5v4.2M8 10.8v.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Research output, not investment advice. Figures come from public sources and model assumptions that can be wrong.</p>
  </header>

  <section class="pipe" id="funnel" aria-label="Screen counts"></section>

  <section class="chg" id="changes" aria-labelledby="chg-title"></section>

  <section class="hl" id="highlights" aria-label="This week's highlights"></section>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-valuation" data-view="valuation">Independent valuation</button>
    <button role="tab" id="tab-consensus" data-view="consensus">Street consensus</button>
    <button role="tab" id="tab-excluded" data-view="excluded">Below cutoff or unverified</button>
  </nav>

  <div class="controls">
    <label for="q">Search<input id="q" type="search" placeholder="Ticker or company"></label>
    <label for="sector">Sector<select id="sector"><option value="">All sectors</option></select></label>
    <label for="minret" id="minret-label">Min. return %<input id="minret" type="number" step="1" placeholder="any"></label>
  </div>

  <section class="panel" id="view"></section>

  <footer id="footer"></footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("data").textContent);
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pct = (v, d = 1) => v == null ? '<span class="na">n/a</span>' : `<span class="${v >= 0 ? "pos" : "neg"}">${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(d)}%</span>`;
  const pp = v => v == null ? '<span class="na">n/a</span>' : `${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(1)} pp`;
  const money = (v, cur) => v == null ? "n/a" : (cur && cur !== "USD" ? cur + " " : "$") + Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const cap = c => { if (!c) return "n/a"; const m = (+c.low + +c.high) / 2; return m >= 1e12 ? "$" + (m / 1e12).toFixed(2) + "T" : "$" + (m / 1e9).toFixed(0) + "B"; };
  const capRange = c => c ? `$${(c.low / 1e9).toFixed(1)}B – $${(c.high / 1e9).toFixed(1)}B` : "n/a";
  const day = s => s ? new Date(s.length === 10 ? s + "T12:00:00" : s).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "n/a";
  const iss = Object.fromEntries(D.issuers.map(r => [r.symbol, r]));
  const C = D.counts;

  $("#asof").textContent = "Closes of " + day(D.reference_session);
  $("#meta").innerHTML = `12-month price upside for ${esc(D.universe.replace(/^US-listed equities \(NYSE, Nasdaq, NYSE American\)/, "US-listed stocks"))}. ` +
    `Market data fetched ${day(D.fetched_at)}, page built ${day(D.built_at)}. Updated every Saturday.`;

  const ICON = {
    up: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10V2.5M2.5 6 6 2.5 9.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    down: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2v7.5M2.5 6 6 9.5 9.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    same: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h7.5M6.5 3 9.5 6 6.5 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    dot: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="2.4" fill="currentColor"/></svg>',
    chev: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  const step = (n, label) => `<span><b>${n}</b> ${label}</span>`;
  $("#funnel").innerHTML = [step(C.listings_checked, "listings screened"), ICON.chev, step(C.issuers, "issuers"), ICON.chev,
    step(C.eligible, "above $50B") + ` <span class="side">(${C.below_cutoff} below, ${C.unverified} unverified)</span>`, ICON.chev,
    step(C.rank_valued, "valued in depth"), ICON.chev, step(C.rank_with_named_targets, "with named-analyst targets")].join("");

  // Highlights: each card names its basis, so the two rankings never blur together.
  function highlights() {
    const R = D.ranked, elig = D.issuers.filter(r => r.status === "eligible" && r.aggregate.upside_pct != null);
    const cards = [];
    if (R.length) {
      const top = R[0], low = R[R.length - 1];
      cards.push({ k: "Highest base case", sym: top.symbol, v: top.scenarios_pct.base, tag: "Our valuation", view: "valuation" });
      cards.push({ k: "Weakest base case", sym: low.symbol, v: low.scenarios_pct.base, tag: "Our valuation", view: "valuation" });
      const gaps = R.map(r => ({ r, g: (iss[r.symbol].aggregate.upside_pct ?? null) })).filter(x => x.g != null)
        .map(x => ({ sym: x.r.symbol, gap: x.g - x.r.scenarios_pct.base })).sort((a, b) => b.gap - a.gap);
      if (gaps.length) cards.push({ k: "Street most above our base", sym: gaps[0].sym, v: gaps[0].gap, pp: true, tag: "Aggregate minus base", view: "valuation" });
    }
    if (elig.length) {
      const fav = elig.slice().sort((a, b) => b.aggregate.upside_pct - a.aggregate.upside_pct)[0];
      cards.push({ k: "Street's highest upside", sym: fav.symbol, v: fav.aggregate.upside_pct, tag: "Provider aggregate", view: "consensus" });
    }
    $("#highlights").innerHTML = cards.map((c, i) => `<button type="button" data-i="${i}">
      <span class="k">${c.k}</span><span class="v"><b>${esc(c.sym)}</b>${c.pp ? `<span class="pill ${c.v >= 0 ? "pos" : "neg"}">${c.v >= 0 ? "+" : "−"}${Math.abs(c.v).toFixed(1)} pp</span>` : pill(c.v)}</span>
      <span class="n">${esc((iss[c.sym] || {}).name)}</span><span class="basis-tag">${c.tag}</span></button>`).join("");
    $("#highlights").hidden = !cards.length;
    $("#highlights").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const c = cards[+b.dataset.i];
      view = c.view; open = c.view === "valuation" ? c.sym : null; $("#q").value = c.view === "consensus" ? c.sym : "";
      history.replaceState(null, "", "#" + view); render(); const t = document.querySelector(".tabs"); if (t) t.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); });
  }

  // What changed: the weekly visit leads with movement since the previous snapshot.
  function whatChanged() {
    const X = D.changes; if (!X) { $("#changes").hidden = true; return; }
    const first = !X.previous_session, rows = [];
    const go = (sym, tab) => `data-sym="${esc(sym)}" data-tab="${tab}"`;
    const st = v => esc(String(v).replace("below_cutoff", "below $50B").replace("eligible", "above $50B"));
    const rec = v => esc(String(v || "n/a").replace(/_/g, " "));
    const inRank = s => D.ranked.some(r => r.symbol === s);
    const tgt = (v, s) => v == null ? "" : money(v >= 100 ? Math.round(v) : v, (iss[s] || {}).currency).replace(/\.00$/, "");
    const block = (title, items, line, empty) => {
      const n = items.length, head = `<h3>${title}<span class="chip">${n}</span></h3>`;
      if (!n) return `<div class="blk">${head}<p class="none">${empty}</p></div>`;
      const li = items.map(line).map(h => `<li>${h}</li>`);
      const more = li.length > 6 ? `<details><summary>Show ${li.length - 6} more</summary><ul>${li.slice(6).join("")}</ul></details>` : "";
      return `<div class="blk">${head}<ul>${li.slice(0, 6).join("")}</ul>${more}</div>`;
    };
    const call = c => {
      const parts = [];
      if (c.target != null) {
        const verb = c.direction === "raise" ? "raised to" : c.direction === "cut" ? "cut to" : c.prior_target != null ? "kept at" : "target";
        parts.push(`${verb} <strong>${tgt(c.target, c.symbol)}</strong>${c.prior_target != null && c.direction !== "unchanged" ? " from " + tgt(c.prior_target, c.symbol) : ""}`);
      }
      const changed = c.prior_rating && c.prior_rating !== c.rating;
      if (c.rating && (changed || c.target == null)) parts.push(changed ? `${esc(c.prior_rating)} &rarr; <strong>${esc(c.rating)}</strong>` : esc(c.rating));
      const v = c.revision_pct != null ? pill(c.revision_pct) : `<span class="chip">${esc(c.bucket || "")}</span>`;
      return `<button type="button" class="crow" ${go(c.symbol, "valuation")} title="${esc(c.firm)} · ${esc(c.analyst)} · ${day(c.issued_at)}${c.horizon_months === 12 ? " · 12-month horizon, counts in the weighted target" : " · horizon not documented, excluded from the weighted target"}">
        <b>${esc(c.symbol)}</b><span class="d">${esc(c.firm)}: ${parts.join(", ")}</span><span class="val">${v}</span></button>`;
    };
    const blocks = [];
    if (!first) blocks.push(block("Base-case moves", X.base_moves, m => `<button type="button" class="crow" ${go(m.symbol, "valuation")}>
        <b>${esc(m.symbol)}</b><span class="d">${pct(m.prev_base)} &rarr; <strong>${pct(m.base)}</strong> &middot; ${m.re_researched ? "re-researched" : "price " + (m.price_change_pct >= 0 ? "+" : "−") + Math.abs(m.price_change_pct).toFixed(1) + "%"}</span>
        <span class="val"><span class="pill ${m.delta_pp >= 0 ? "pos" : "neg"}">${pp(m.delta_pp)}</span></span></button>`, "No base case moved."));
    blocks.push(block("Analyst calls", X.analyst_calls, call, "No named-analyst actions on researched names this week."));
    if (!first) blocks.push(block("Street target changes", X.street_moves, m => `<button type="button" class="crow" ${go(m.symbol, "consensus")}>
        <b>${esc(m.symbol)}</b><span class="d">mean ${tgt(m.prev_mean, m.symbol)} &rarr; <strong>${tgt(m.mean, m.symbol)}</strong>${m.recommendation !== m.prev_recommendation ? " &middot; " + rec(m.prev_recommendation) + " &rarr; <strong>" + rec(m.recommendation) + "</strong>" : ""}</span>
        <span class="val">${pill(m.target_change_pct)}</span></button>`, "No provider mean target moved 2% or more."));
    if (!first) blocks.push(block("Crossed the $50B line", X.crossings, m => `<button type="button" class="crow" ${go(m.symbol, m.status === "eligible" ? "consensus" : "excluded")} title="${esc(m.name || "")}">
        <b>${esc(m.symbol)}</b><span class="d">${st(m.prev_status)} &rarr; <strong>${st(m.status)}</strong></span>
        <span class="val num">${cap(m.market_cap_usd)}</span></button>`, "No name entered or left the universe."));
    blocks.push(block(first ? "Researched this run" : "Research added", X.research, r => `<button type="button" class="crow" ${go(r.symbol, inRank(r.symbol) ? "valuation" : "consensus")}>
        <b>${esc(r.symbol)}</b><span class="d">${esc((iss[r.symbol] || {}).name || "")}</span><span class="val"><span class="chip ${r.kind === "new" ? "acc" : ""}">${r.kind}</span></span></button>`, "No new research this week."));
    $("#changes").innerHTML = `<div class="chg-head"><h2 id="chg-title">Since last week</h2><p>${first
      ? `First snapshot. Week-over-week moves start with next Saturday's run; analyst calls since ${day(X.window_start)} are shown now.`
      : `Closes of ${day(X.previous_session)} &rarr; ${day(D.reference_session)}.`}</p></div><div class="chg-grid">${blocks.join("")}</div>`;
    $("#changes").addEventListener("click", e => { const b = e.target.closest(".crow"); if (!b) return;
      view = b.dataset.tab; open = view === "valuation" && inRank(b.dataset.sym) ? b.dataset.sym : null; $("#q").value = open ? "" : b.dataset.sym;
      history.replaceState(null, "", "#" + view); render(); const t = document.querySelector(".tabs"); if (t) t.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); });
  }

  const sectors = [...new Set(D.issuers.map(r => r.sector).filter(Boolean))].sort();
  $("#sector").insertAdjacentHTML("beforeend", sectors.map(s => `<option>${esc(s)}</option>`).join(""));

  let view = "valuation", open = null;
  try { const v = localStorage.getItem("view"); if (v) view = v; } catch (e) {}
  if (["#valuation", "#consensus", "#excluded"].includes(location.hash)) view = location.hash.slice(1);

  function match(sym, ret) {
    const r = iss[sym] || {}, q = $("#q").value.trim().toLowerCase(), sec = $("#sector").value, min = $("#minret").value;
    if (q && !(sym.toLowerCase().includes(q) || (r.name || "").toLowerCase().includes(q))) return false;
    if (sec && r.sector !== sec) return false;
    if (min !== "" && view !== "excluded" && (ret == null || ret < +min)) return false;
    return true;
  }

  // Scenario bar: one shared scale for every row, so bars compare across names.
  const LO = -60, HI = 100;
  function bar(s) {
    const W = 170, x = v => 4 + (Math.max(LO, Math.min(HI, v)) - LO) / (HI - LO) * (W - 8);
    const z = x(0);
    return `<svg class="bar" viewBox="0 0 ${W} 22" role="img" aria-label="Bear ${s.bear.toFixed(0)}%, base ${s.base.toFixed(0)}%, bull ${s.bull.toFixed(0)}%">
      <line x1="${z}" x2="${z}" y1="2" y2="20" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 2"/>
      <rect x="${x(s.bear)}" y="8" width="${Math.max(2, x(s.bull) - x(s.bear))}" height="6" rx="3" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width=".8"/>
      <circle cx="${x(s.base)}" cy="11" r="4.5" fill="${s.base >= 0 ? "var(--up)" : "var(--down)"}"/></svg>`;
  }

  const pill = v => v == null ? '<span class="na">n/a</span>' : `<span class="pill ${v >= 0 ? "pos" : "neg"}">${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(1)}%</span>`;

  // Price-target strip: low–high range, average target and today's close on one line.
  function strip(lo, hi, avg, close, wide) {
    if (lo == null || hi == null || close == null) return '<span class="na">n/a</span>';
    const a = Math.min(lo, close), b = Math.max(hi, close), pad = (b - a) * 0.06 || 1;
    const W = wide ? 420 : 150, H = wide ? 46 : 26, y = wide ? 16 : 13;
    const x = v => 6 + (v - (a - pad)) / ((b + pad) - (a - pad)) * (W - 12);
    const lab = (v, t, anchor) => wide ? `<text x="${x(v)}" y="40" font-size="10.5" text-anchor="${anchor}" fill="var(--muted)">${t} ${money(v)}</text>` : "";
    return `<svg class="strip${wide ? " wide" : ""}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Targets ${money(lo)} to ${money(hi)}, average ${money(avg)}, close ${money(close)}">
      <line x1="${x(lo)}" x2="${x(hi)}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="${x(lo)}" cy="${y}" r="2.5" fill="var(--down)"/><circle cx="${x(hi)}" cy="${y}" r="2.5" fill="var(--up)"/>
      ${avg != null ? `<circle cx="${x(avg)}" cy="${y}" r="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>` : ""}
      <line x1="${x(close)}" x2="${x(close)}" y1="${y - 8}" y2="${y + 8}" stroke="var(--fg)" stroke-width="2"/>
      ${lab(lo, "Low", "start")}${lab(hi, "High", "end")}</svg>`;
  }

  // Column sorting inside a tab. Each tab's default sort is its stated ranking basis.
  const sorts = { valuation: { key: "base", dir: -1 }, consensus: { key: "agg", dir: -1 } };
  const th = (tab, key, label, cls) => {
    const s = sorts[tab], on = s.key === key;
    return `<th class="sort ${cls || ""}" tabindex="0" data-tab="${tab}" data-key="${key}"${on ? ` aria-sort="${s.dir < 0 ? "descending" : "ascending"}"` : ""}>${label}${on ? (s.dir < 0 ? " ↓" : " ↑") : ""}</th>`;
  };
  function order(rows, tab, get) {
    const s = sorts[tab], f = get[s.key];
    return rows.slice().sort((p, q) => { const a = f(p), b = f(q);
      if (a == null && b == null) return 0; if (a == null) return 1; if (b == null) return -1;
      return (typeof a === "string" ? a.localeCompare(b) : a - b) * s.dir; });
  }

  // Analyst timeline: one row per analyst action, rating and target merged, split at the last earnings release.
  const RANK = { Sell: 0, Hold: 1, Buy: 2 };
  function timeline(d) {
    const groups = {};
    (d.history || []).forEach(e => { const k = e.analyst + "|" + e.issued_at.slice(0, 10); (groups[k] = groups[k] || { analyst: e.analyst, firm: e.firm, day: e.issued_at.slice(0, 10), src: e.source })[e.field] = e; });
    const rows = Object.values(groups).sort((a, b) => (a.day < b.day ? 1 : a.day > b.day ? -1 : 0));
    const earn = d.earnings_at ? d.earnings_at.slice(0, 10) : null;
    let h = "", divided = false;
    rows.forEach(g => {
      if (earn && !divided && g.day <= earn) { h += `<tr class="divider"><td colspan="7">Before last earnings release · ${day(earn)}</td></tr>`; divided = true; }
      const r = g.rating, t = g.target;
      let act = "Reiterated", icon = ICON.same, cls = "";
      if (r && r.prior_observed != null && r.bucket && RANK[r.bucket] != null) {
        const prior = (d.history.find(e => e.field === "rating" && e.analyst === g.analyst && e.value === r.prior_observed) || {}).bucket;
        if (prior && RANK[r.bucket] > RANK[prior]) { act = "Upgrade"; icon = ICON.up; cls = "up"; }
        else if (prior && RANK[r.bucket] < RANK[prior]) { act = "Downgrade"; icon = ICON.down; cls = "dn"; }
      } else if (r && r.prior_observed == null && !t) { act = "First seen"; icon = ICON.dot; }
      else if (!r && t && t.direction) { act = { raise: "Target raised", cut: "Target cut", unchanged: "Target reaffirmed" }[t.direction]; icon = t.direction === "raise" ? ICON.up : t.direction === "cut" ? ICON.down : ICON.same; cls = t.direction === "raise" ? "up" : t.direction === "cut" ? "dn" : ""; }
      else if (!r && t) { act = "First seen"; icon = ICON.dot; }
      if (act === "Reiterated" && t && (t.direction === "raise" || t.direction === "cut")) {
        act = t.direction === "raise" ? "Target raised" : "Target cut"; icon = t.direction === "raise" ? ICON.up : ICON.down; cls = t.direction === "raise" ? "up" : "dn"; }
      const ratingTxt = r ? (r.prior_observed != null && r.prior_observed !== r.value ? `${esc(r.prior_observed)} → ` : "") + `<b>${esc(r.value)}</b>` : '<span class="na">—</span>';
      const prior = t ? (t.source_prior != null ? t.source_prior : t.prior_observed) : null;
      const tgt = t ? (prior != null && prior !== t.value ? `${money(prior)} → ` : "") + `<b>${money(t.value)}</b>` : '<span class="na">—</span>';
      const status = [r, t].filter(Boolean).map(e => e.status_at_cutoff).filter(s => s && s !== "active");
      const src = (t || r).source;
      h += `<tr><td class="l"><span class="act"><i class="${cls}" aria-hidden="true">${icon}</i>${act}</span></td><td class="l">${ratingTxt}</td>
        <td class="l">${esc(g.analyst)}<br><span class="note">${esc(g.firm)}</span></td><td>${tgt}</td><td>${t && t.revision_pct != null ? pct(t.revision_pct) : '<span class="na">—</span>'}</td>
        <td class="l">${day(g.day)}${status.length ? `<br><span class="chip warn" title="Kept in the timeline, left out of the weighted target">${esc(status[0])}</span>` : ""}</td>
        <td class="l">${/^https?:/.test(src) ? `<a href="${esc(src)}" target="_blank" rel="noopener">source</a>` : esc(src)}</td></tr>`;
    });
    return `<table><thead><tr><th class="l">Action</th><th class="l">Rating</th><th class="l">Analyst</th><th>Target</th><th>Change</th><th class="l">Date</th><th class="l">Source</th></tr></thead>
      <tbody>${h || '<tr><td colspan="7" class="empty">No named calls recorded.</td></tr>'}</tbody></table>`;
  }

  function name(sym) {
    const r = iss[sym] || {};
    const extra = r.other_classes ? ` · also ${r.other_classes.join(", ")}` : "";
    return `<span class="co"><b>${esc(sym)}</b><small title="${esc(r.name)}">${esc(r.name)}${esc(extra)}</small></span>`;
  }

  function valuation() {
    const rankOf = Object.fromEntries(D.ranked.map((r, i) => [r.symbol, i + 1]));
    const rows = order(D.ranked.filter(r => match(r.symbol, r.scenarios_pct.base)), "valuation", {
      rank: r => -rankOf[r.symbol], co: r => r.symbol, cap: r => +r.market_cap_usd.low, base: r => r.scenarios_pct.base,
      bear: r => r.scenarios_pct.bear, bull: r => r.scenarios_pct.bull, an: r => r.analyst_upside_pct, gap: r => r.analyst_minus_base_pp,
      date: r => (D.details[r.symbol] || {}).researched_at });
    const waiting = D.omitted.filter(o => o.reason === "independent valuation unavailable");
    let h = `<p class="basis"><strong>Sorted by independent base-case 12-month price return</strong>, built from filings and stated operating assumptions. ` +
      `Analyst column is the 90-day half-life weighted target of the named analysts found (a sample, not full Street consensus). Gap = analyst upside minus base case. ` +
      `Returns are measured from this week's close; each name's research date is shown. About 15 names are researched in depth each week.</p>`;
    if (sorts.valuation.key !== "base") h += `<p class="basis">Re-sorted by the column you picked. # still shows the rank by base-case return.</p>`;
    h += `<div class="tablebox desk"><table><thead><tr>${th("valuation", "rank", "#")}${th("valuation", "co", "Company", "l")}<th>Close</th>${th("valuation", "cap", "Mkt cap")}<th class="l">Bear · base · bull (−60% to +100%)</th>` +
      `${th("valuation", "base", "Base")}${th("valuation", "bear", "Bear")}${th("valuation", "bull", "Bull")}${th("valuation", "an", "Analyst wtd")}${th("valuation", "gap", "Gap")}${th("valuation", "date", "Researched", "l")}</tr></thead><tbody>`;
    if (!rows.length) h += `<tr><td colspan="11" class="empty">${D.ranked.length ? "No researched names match these filters." : "No names have deep research yet. The first batch arrives with the next weekly run."}</td></tr>`;
    rows.forEach(r => {
      const d = D.details[r.symbol] || {}, isOpen = open === r.symbol;
      h += `<tr class="row${isOpen ? " open" : ""}" tabindex="0" data-sym="${esc(r.symbol)}" aria-expanded="${isOpen}">
        <td>${rankOf[r.symbol]}</td><td class="l">${name(r.symbol)}</td><td>${money(r.close)}</td><td>${cap(r.market_cap_usd)}</td>
        <td class="l">${bar(r.scenarios_pct)}</td><td>${pill(r.scenarios_pct.base)}</td><td>${pct(r.scenarios_pct.bear)}</td><td>${pct(r.scenarios_pct.bull)}</td>
        <td>${pct(r.analyst_upside_pct)} <span class="chip">${r.target_count} named</span></td><td>${pp(r.analyst_minus_base_pp)}</td>
        <td class="l">${day(d.researched_at)}${stale(d.researched_at) ? ' <span class="chip warn">stale</span>' : ""}</td></tr>`;
      if (isOpen) h += `<tr class="detail"><td colspan="11">${detail(r, d)}</td></tr>`;
    });
    h += `</tbody></table></div>`;
    h += `<ol class="mlist">${rows.map(r => { const isOpen = open === r.symbol, s = r.scenarios_pct;
      return `<li><button type="button" class="mrow" data-sym="${esc(r.symbol)}" aria-expanded="${isOpen}"><span class="rk">${rankOf[r.symbol]}</span>${name(r.symbol)}${pill(s.base)}
        <span class="sub">${bar(s)}<span>Bear ${pct(s.bear, 0)} · Bull ${pct(s.bull, 0)}</span></span></button>
        ${isOpen ? `<div class="mdetail">${detail(r, D.details[r.symbol] || {})}</div>` : ""}</li>`; }).join("") || `<li class="empty">No researched names match these filters.</li>`}</ol>`;
    const wl = waiting.filter(o => match(o.symbol, null) || $("#minret").value !== "");
    h += `<details class="wait"><summary>Awaiting deep research: ${waiting.length} eligible names</summary>
      <p class="note">They are listed under Street consensus meanwhile. Unresearched names are never mixed into this ranking.</p>
      <div class="symlist">${wl.map(o => `<span class="chip">${esc(o.symbol)}</span>`).join("")}</div></details>`;
    return h;
  }

  function stale(s) { return s && (new Date(D.reference_session) - new Date(s)) / 864e5 > 120; }

  function detail(r, d) {
    const v = d.valuation || {}, cs = v.cases || {}, t = d.targets || {}, rt = d.ratings || {}, se = d.sensitivity || {};
    const caseCard = k => { const c = cs[k] || {}; return `<div class="case"><div class="eyebrow">${k} case</div>
      <div class="t num">${money(v[k])} ${pct(r.scenarios_pct[k])}</div><div><b>Driver.</b> ${esc(c.driver)}</div><div class="note">${esc(c.assumption)}</div></div>`; };
    const cnt = rt.counts || { Buy: 0, Hold: 0, Sell: 0 }, tot = cnt.Buy + cnt.Hold + cnt.Sell;
    const seg = (n, color) => Array.from({ length: n }, () => `<i style="background:${color}"></i>`).join("");
    const mix = tot ? `<div class="mix"><div class="lbl"><span class="neg"><b>${cnt.Sell}</b> Sell</span><span><b>${cnt.Hold}</b> Hold</span><span class="pos"><b>${cnt.Buy}</b> Buy</span></div>
      <div class="segs" aria-hidden="true">${seg(cnt.Sell, "var(--down)")}${seg(cnt.Hold, "var(--muted)")}${seg(cnt.Buy, "var(--up)")}</div>
      ${rt.weighted_pct ? `<span class="note">Recency-weighted: ${rt.weighted_pct.Buy.toFixed(0)}% Buy · ${rt.weighted_pct.Hold.toFixed(0)}% Hold · ${rt.weighted_pct.Sell.toFixed(0)}% Sell</span>` : ""}</div>` : '<span class="na">No mapped ratings</span>';
    return `<div class="dgrid">
      <div class="cases">${caseCard("bear")}${caseCard("base")}${caseCard("bull")}</div>
      <div class="two">
        <dl class="kv"><dt>Method</dt><dd>${esc(v.method)}</dd><dt>Close implies</dt><dd>${esc(v.implied_by_close)}</dd>
          <dt>Sensitivity</dt><dd>${esc(v.sensitivity)}</dd><dt>Watch</dt><dd>${esc(v.watch_metric)}</dd><dt>Next disclosure</dt><dd>${esc(v.next_disclosure)}</dd>
          ${d.dividend_per_share != null ? `<dt>Dividends</dt><dd>${money(d.dividend_per_share)} expected; base total return ${pct(r.base_total_return_pct)}</dd>` : ""}
          <dt>Research close</dt><dd>${d.research_close ? money(d.research_close.close) + " on " + day(d.research_close.close_date) : "n/a"}</dd></dl>
        <dl class="kv"><dt>Coverage</dt><dd><span class="chip acc">${esc(d.coverage)}</span> named analysts found, not full Street</dd>
          <dt>Ratings</dt><dd>${mix}</dd>
          <dt>Targets</dt><dd>${t.count || 0} active · weighted ${money(t.target)} ${pct(t.upside_pct)} · equal-weight ${money(se.equal && se.equal.target)} ${pct(se.equal && se.equal.upside_pct)}
            ${t.range ? `<div>${strip(t.range[0], t.range[1], t.target, r.close, true)}<span class="note">○ weighted target · | close ${money(r.close)}</span></div>` : ""}</dd>
          <dt>Range</dt><dd>${t.range ? money(t.range[0]) + " – " + money(t.range[1]) : "n/a"}; median age ${t.median_age_days != null ? t.median_age_days + " days" : "n/a"}; largest weight ${t.max_weight_pct != null ? t.max_weight_pct.toFixed(0) + "%" : "n/a"}</dd>
          <dt>Since earnings</dt><dd>${t.post_earnings != null ? t.post_earnings + " of " + t.count + " targets updated after " + day(d.earnings_at) : "earnings date not recorded"}</dd>
          <dt>Half-life check</dt><dd>45d ${pct(se["45"] && se["45"].upside_pct)} · 90d ${pct(se["90"] && se["90"].upside_pct)} · 180d ${pct(se["180"] && se["180"].upside_pct)}</dd></dl>
      </div>
      ${d.analyst_notes ? `<p style="margin:0;max-width:80ch">${esc(d.analyst_notes)}</p>` : ""}
      <div><h3 style="margin-bottom:8px">Analyst timeline</h3><div class="hist">${timeline(d)}</div></div>
      <div><h3 style="margin-bottom:6px">Sources</h3><ol class="srcs">${(d.sources || []).map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label || s.url)}</a>${s.supports ? ` <span class="note">· ${esc(s.supports)}</span>` : ""}</li>`).join("")}</ol></div>
    </div>`;
  }

  function consensus() {
    const elig = D.issuers.filter(r => r.status === "eligible");
    const aggRank = Object.fromEntries(elig.slice().sort((a, b) => (b.aggregate.upside_pct == null) - (a.aggregate.upside_pct == null) || (b.aggregate.upside_pct || 0) - (a.aggregate.upside_pct || 0) || a.symbol.localeCompare(b.symbol)).map((r, i) => [r.symbol, i + 1]));
    const rows = order(elig.filter(r => match(r.symbol, r.aggregate.upside_pct)), "consensus", {
      rank: r => -aggRank[r.symbol], co: r => r.symbol, sector: r => r.sector || "", cap: r => +r.market_cap_usd.low,
      agg: r => r.aggregate.upside_pct, n: r => r.aggregate.analysts });
    let h = `<p class="basis"><strong>Sorted by provider aggregate upside</strong>: the mean analyst target published by Yahoo Finance, measured against the ${day(D.reference_session)} close and fetched ${day(D.fetched_at)}. ` +
      `This is a separate ranking from the independent valuation and is never merged with it. Provider counts, collection windows and target dates are not disclosed per analyst.</p>`;
    if (sorts.consensus.key !== "agg") h += `<p class="basis">Re-sorted by the column you picked. # still shows the rank by aggregate upside.</p>`;
    h += `<div class="tablebox desk"><table><thead><tr>${th("consensus", "rank", "#")}${th("consensus", "co", "Company", "l")}${th("consensus", "sector", "Sector", "l")}<th>Close</th>${th("consensus", "cap", "Mkt cap")}<th>Mean target</th>${th("consensus", "agg", "Aggregate upside")}<th class="l">Low · mean ○ · close | · high</th>${th("consensus", "n", "Analysts")}<th class="l">Rating</th><th class="l">Deep research</th></tr></thead><tbody>`;
    if (!rows.length) h += `<tr><td colspan="11" class="empty">No names match these filters.</td></tr>`;
    rows.forEach(r => {
      const a = r.aggregate, rk = D.ranked.find(x => x.symbol === r.symbol);
      h += `<tr><td>${aggRank[r.symbol]}</td><td class="l">${name(r.symbol)}</td><td class="l">${esc(r.sector)}</td><td>${money(r.close)}</td><td>${cap(r.market_cap_usd)}</td>
        <td>${money(a.mean)}</td><td>${pill(a.upside_pct)}</td><td class="l">${strip(a.low, a.high, a.mean, r.close)}</td><td>${a.analysts == null ? "n/a" : a.analysts}</td>
        <td class="l">${esc((a.recommendation || "n/a").replace("_", " "))}</td><td class="l">${rk ? `<span class="chip acc">base ${rk.scenarios_pct.base >= 0 ? "+" : "−"}${Math.abs(rk.scenarios_pct.base).toFixed(1)}%</span>` : '<span class="chip">pending</span>'}</td></tr>`;
    });
    h += `</tbody></table></div>`;
    return h + `<ol class="mlist">${rows.map(r => { const a = r.aggregate;
      return `<li><div class="mrow" style="cursor:default"><span class="rk">${aggRank[r.symbol]}</span>${name(r.symbol)}${pill(a.upside_pct)}
        <span class="sub">${strip(a.low, a.high, a.mean, r.close)}<span>${a.analysts == null ? "n/a" : a.analysts} analysts · ${esc((a.recommendation || "n/a").replace("_", " "))}</span></span></div></li>`; }).join("") || `<li class="empty">No names match these filters.</li>`}</ol>`;
  }

  function excluded() {
    const rows = D.issuers.filter(r => r.status !== "eligible").filter(r => match(r.symbol, null))
      .sort((a, b) => (a.status > b.status ? -1 : a.status < b.status ? 1 : b.market_cap_usd.high - a.market_cap_usd.high));
    let h = `<p class="basis">Issuers whose market cap is not verifiably <strong>above $50B</strong> at the reference close. The cap interval is close × shares outstanding, widened to include the screener's figure, ±2% for share-count lag. ` +
      `If the interval straddles $50B the name is marked unverified rather than guessed.</p>`;
    h += `<div class="tablebox"><table><thead><tr><th class="l">Company</th><th class="l">Status</th><th>Close</th><th>Cap interval</th><th class="l">Sector</th></tr></thead><tbody>`;
    if (!rows.length) h += `<tr><td colspan="5" class="empty">No names match these filters.</td></tr>`;
    rows.forEach(r => { h += `<tr><td class="l">${name(r.symbol)}</td><td class="l"><span class="chip ${r.status === "unverified" ? "warn" : ""}">${r.status === "unverified" ? "unverified" : "below $50B"}</span></td>
      <td>${money(r.close)}</td><td>${capRange(r.market_cap_usd)}</td><td class="l">${esc(r.sector)}</td></tr>`; });
    return h + `</tbody></table></div>`;
  }

  function render() {
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === view)));
    $("#tab-valuation").textContent = `Independent valuation (${D.ranked.length})`;
    $("#tab-consensus").textContent = `Street consensus (${C.eligible})`;
    $("#tab-excluded").textContent = `Below cutoff or unverified (${C.below_cutoff + C.unverified})`;
    $("#minret-label").hidden = view === "excluded";
    $("#view").innerHTML = view === "valuation" ? valuation() : view === "consensus" ? consensus() : excluded();
    fitDetail();
  }

  // The detail panel lives in a wide table row; pin it to the visible width of the scroll box.
  function fitDetail() {
    const g = $(".dgrid"), box = $(".tablebox");
    if (g && box) g.style.width = Math.max(260, box.clientWidth - 34) + "px";
  }
  window.addEventListener("resize", fitDetail);

  document.querySelector(".tabs").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    view = b.dataset.view; open = null;
    try { localStorage.setItem("view", view); } catch (err) {}
    history.replaceState(null, "", "#" + view); render();
  });
  const resort = e => { const h = e.target.closest("th.sort"); if (!h) return false;
    const s = sorts[h.dataset.tab]; if (s.key === h.dataset.key) s.dir *= -1; else { s.key = h.dataset.key; s.dir = ["co", "sector"].includes(s.key) ? 1 : -1; }
    render(); const again = document.querySelector(`th.sort[data-key="${h.dataset.key}"]`); if (again) again.focus(); return true; };
  const toggle = e => { if (resort(e)) return; const tr = e.target.closest("tr.row, button.mrow"); if (!tr || e.target.closest("a")) return; open = open === tr.dataset.sym ? null : tr.dataset.sym; render(); };
  $("#view").addEventListener("click", toggle);
  $("#view").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { if (e.target.closest("tr.row, th.sort")) { e.preventDefault(); toggle(e); } /* buttons get Enter/Space natively */ } });
  ["q", "sector", "minret"].forEach(id => $("#" + id).addEventListener("input", render));
  window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (["valuation", "consensus", "excluded"].includes(v)) { view = v; render(); } });

  $("#footer").innerHTML = `<p><b>Method.</b> Eligibility needs a verified whole-company market cap strictly above $50B (a stricter filter on the stock-upside-analysis skill's $20B floor), one row per issuer, with extra share classes folded in. ` +
    `Independent targets come from bear, base and bull cases built on filings; returns are price-only over 12 months unless a dividend line is shown. ` +
    `Named-analyst weighting gives each analyst one vote, halving with every 90 days of age.</p>` +
    `<p><b>Data.</b> Universe from the <a href="https://www.nasdaq.com/market-activity/stocks/screener" target="_blank" rel="noopener">Nasdaq stock screener</a>; closes, shares and aggregate targets from Yahoo Finance via yfinance; deep research cites its own sources in each row. ` +
    `${D.failures.length ? D.failures.length + " listings failed to load this week. " : ""}${D.rejected.length ? D.rejected.length + " research files were rejected by validation this week." : ""}</p>`;

  whatChanged();
  highlights();
  render();
})();
</script>
