<title>Stock Upside Weekly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --sunk: #f8fafc; --hover: #f2f5f8;
  --fg: #0f172a; --fg2: #334155; --muted: #556175; --line: #e3e8ee; --line2: #d3dae3;
  --accent: #2563eb; --accent-fg: #ffffff; --accent-soft: #eef3ff; --accent-line: #c7d7fe; --band: #c3d5fb;
  --up: #137837; --up-soft: #e6f4ea; --down: #c2361f; --down-soft: #fcebe7; --warn: #965a00; --warn-soft: #fcf1dd;
  --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 2px 6px -2px rgba(15, 23, 42, .06);
  --shadow-lift: 0 2px 4px rgba(15, 23, 42, .05), 0 14px 28px -10px rgba(15, 23, 42, .18);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bar-h: 60px; --top: calc(env(safe-area-inset-top, 0px) + var(--bar-h));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0e14; --card: #12161f; --sunk: #0f131b; --hover: #181e29;
  --fg: #e7eaf0; --fg2: #c3cad6; --muted: #98a2b3; --line: #232a36; --line2: #2f3846;
  --accent: #6d9cff; --accent-fg: #0b0e14; --accent-soft: #162140; --accent-line: #2b4278; --band: #2a3f6e;
  --up: #4cc38a; --up-soft: rgba(76, 195, 138, .13); --down: #ff8270; --down-soft: rgba(255, 130, 112, .13); --warn: #e8a945; --warn-soft: rgba(232, 169, 69, .13);
  --shadow: 0 1px 2px rgba(0, 0, 0, .35); --shadow-lift: 0 2px 4px rgba(0, 0, 0, .4), 0 14px 28px -10px rgba(0, 0, 0, .7);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b0e14; --card: #12161f; --sunk: #0f131b; --hover: #181e29;
  --fg: #e7eaf0; --fg2: #c3cad6; --muted: #98a2b3; --line: #232a36; --line2: #2f3846;
  --accent: #6d9cff; --accent-fg: #0b0e14; --accent-soft: #162140; --accent-line: #2b4278; --band: #2a3f6e;
  --up: #4cc38a; --up-soft: rgba(76, 195, 138, .13); --down: #ff8270; --down-soft: rgba(255, 130, 112, .13); --warn: #e8a945; --warn-soft: rgba(232, 169, 69, .13);
  --shadow: 0 1px 2px rgba(0, 0, 0, .35); --shadow-lift: 0 2px 4px rgba(0, 0, 0, .4), 0 14px 28px -10px rgba(0, 0, 0, .7);
  color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { accent-color: var(--accent); scrollbar-color: var(--line2) transparent; -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--top) + 16px); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
::selection { background: var(--accent-soft); color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
a { color: var(--accent); text-underline-offset: .18em; text-decoration-thickness: 1px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
h1 { font-size: 24px; line-height: 1.25; font-weight: 600; letter-spacing: -.022em; }
h2 { font-size: 15px; line-height: 1.35; font-weight: 600; letter-spacing: -.01em; }
h3 { font-size: 13px; font-weight: 600; letter-spacing: -.005em; }
h4 { font-size: 12.5px; font-weight: 600; }
.num, table { font-variant-numeric: tabular-nums; }
.pos { color: var(--up); } .neg { color: var(--down); } .na { color: var(--muted); }
.muted { color: var(--muted); }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.pos { background: var(--up-soft); } .pill.neg { background: var(--down-soft); }
.chip { display: inline-flex; align-items: center; font: 500 11.5px/18px var(--font); padding: 0 8px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--line2); color: var(--fg); }
kbd { display: inline-block; min-width: 18px; padding: 0 5px; font: 500 11px/16px var(--font); color: var(--muted); text-align: center; background: var(--bg); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.bar-in { max-width: 1400px; height: var(--bar-h); margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 24px;
  padding-inline: max(24px, env(safe-area-inset-left, 0px)) max(24px, env(safe-area-inset-right, 0px)); }
.brand { grid-column: 1; justify-self: start; display: inline-flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; font-weight: 600; font-size: 15px; letter-spacing: -.012em; white-space: nowrap; }
.brand svg { flex: none; }
.nav { grid-column: 2; display: flex; gap: 2px; }
.nav a { color: var(--muted); text-decoration: none; font-weight: 500; font-size: 13.5px; padding: 6px 10px; border-radius: 8px; }
.nav a:hover { color: var(--fg); background: var(--hover); }
.nav a[aria-current] { color: var(--accent); background: var(--accent-soft); }
.bar-end { grid-column: 3; justify-self: end; display: flex; align-items: center; gap: 12px; }
.asof { font-size: 13px; color: var(--muted); white-space: nowrap; }

/* Page */
.wrap { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px;
  padding-block: 32px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.wrap > * { min-width: 0; }
.lede { margin: 6px 0 0; color: var(--muted); max-width: 120ch; }

/* Top upside cards */
.cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
.card { all: unset; box-sizing: border-box; min-width: 0; cursor: pointer; display: grid; align-content: start; gap: 2px; padding: 16px 16px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.card:hover { border-color: var(--line2); box-shadow: var(--shadow-lift); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { .card { transition: box-shadow .2s, border-color .2s, transform .2s cubic-bezier(.2, .7, .2, 1); } .card:hover { transform: translateY(-2px); } }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tk { font-size: 17px; font-weight: 600; letter-spacing: -.012em; }
.rank { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; font-variant-numeric: tabular-nums; }
.card-name { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 10px; }
.card-k { font-size: 12px; color: var(--muted); }
.card-v { font-size: 28px; font-weight: 600; line-height: 1.15; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.card-px { display: flex; align-items: flex-end; gap: 10px; margin: 10px 0 2px; }
.px { display: grid; gap: 1px; min-width: 0; }
.px small { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.px b { font-size: 15px; font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.px b.px-c { font-weight: 500; color: var(--fg2); }
.px-arrow { flex: none; color: var(--muted); margin-bottom: 3px; }
.was { font-size: 12px; color: var(--muted); min-height: 18px; }
.card .rbar { width: 100%; height: auto; margin-top: 12px; }
.card-rng { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }


/* Range bar (shared scale) and target strip */
.rbar { display: block; overflow: visible; }
.rbar .zero { stroke: var(--line2); stroke-width: 1; stroke-dasharray: 2 2; }
.rbar .track { stroke: var(--line); stroke-width: 4; stroke-linecap: round; }
.rbar .band { stroke: var(--band); stroke-width: 4; stroke-linecap: round; }
.rbar .ghost { fill: var(--card); stroke: var(--muted); stroke-width: 1.5; }
.rbar .dot { stroke: var(--card); stroke-width: 2; }
.rbar .dot.pos { fill: var(--up); } .rbar .dot.neg { fill: var(--down); }
.strip { display: block; width: 100%; max-width: 380px; height: auto; overflow: visible; margin-top: 6px; }
.strip .s-track { stroke: var(--line2); stroke-width: 4; stroke-linecap: round; }
.strip .s-lo { fill: var(--down); } .strip .s-hi { fill: var(--up); }
.strip .s-avg { fill: var(--card); stroke: var(--accent); stroke-width: 2.5; }
.strip .s-close { stroke: var(--fg); stroke-width: 2; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin: 4px 0 0; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; vertical-align: -1px; margin-right: 5px; }
.legend .lg-avg { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); }
.legend .lg-close { width: 2px; height: 11px; background: var(--fg); }
.legend .lg-lo, .legend .lg-hi { width: 7px; height: 7px; border-radius: 50%; vertical-align: 0; }
.legend .lg-lo { background: var(--down); } .legend .lg-hi { background: var(--up); }
.legend .lg-ghost { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); }
.legend .lg-band { width: 18px; height: 4px; border-radius: 2px; background: var(--band); vertical-align: 2px; }

/* Panels */
.work { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-areas: "stocks week"; gap: 20px; align-items: start; }
.panel { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sub { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.week-jump { display: none; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; padding: 12px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; color: var(--fg2); text-decoration: none; font-size: 13px; }
.week-jump:hover { border-color: var(--line2); background: var(--hover); }
.week-jump b { color: var(--fg); font-weight: 600; }
.nw { white-space: nowrap; }
.week-jump svg { flex: none; color: var(--muted); }
.list-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.list-meta .legend { margin: 0; }
.keys { display: inline-flex; align-items: center; gap: 6px; }
.legend .lg-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--up); }
.stocks { grid-area: stocks; }
.week { grid-area: week; position: sticky; top: calc(var(--top) + 16px); max-height: calc(100vh - var(--top) - 32px); display: flex; flex-direction: column; }
.week .panel-head { flex: none; }
.week-body { overflow-y: auto; overscroll-behavior: contain; border-radius: 0 0 12px 12px; }
section[id], aside[id] { scroll-margin-top: calc(var(--top) + 16px); }
#rows [data-sym] { scroll-margin-top: calc(var(--top) + 52px); }

/* Controls */
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
input, select { font: 13.5px var(--font); color: var(--fg); background: var(--card); border: 1px solid var(--line2); border-radius: 8px; min-height: 34px; padding: 6px 10px; max-width: 100%; }
input::placeholder { color: var(--muted); }
input:hover, select:hover { border-color: var(--muted); }
input:focus-visible, select:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 0; border-color: var(--accent); }
.search { position: relative; display: block; }
.m-only { display: none; }
.search svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; color: var(--muted); pointer-events: none; }
.search input { width: 250px; padding-left: 32px; padding-right: 34px; }
.search kbd { position: absolute; right: 8px; top: 50%; translate: 0 -50%; pointer-events: none; }
.search input:not(:placeholder-shown) ~ kbd { display: none; }

/* Stock table */
.sortnote { margin: 0; padding: 8px 16px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
.tablewrap { min-width: 0; }
table.grid { width: 100%; border-collapse: separate; border-spacing: 0; }
.grid th, .grid td { padding: 10px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
.grid th { position: sticky; top: calc(var(--top) + 1px); z-index: 2; background: var(--sunk); color: var(--muted); font-size: 12px; font-weight: 500; padding-block: 8px; }
.grid th:first-child, .grid td:first-child { padding-left: 16px; }
.grid th:last-child, .grid td:last-child { padding-right: 16px; }
.grid .l { text-align: left; }
.grid tbody tr:last-child > td { border-bottom: 0; }
.grid tbody tr:last-child > td:first-child { border-bottom-left-radius: 12px; }
.grid tbody tr:last-child > td:last-child { border-bottom-right-radius: 12px; }
.sortbtn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; border-radius: 4px; }
.sortbtn:hover { color: var(--fg); }
.sortbtn.on { color: var(--accent); font-weight: 600; }
.sortbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
tr.row { cursor: pointer; }
tr.row:hover > td { background: var(--hover); }
tr.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
tr.row.open > td { background: var(--accent-soft); border-bottom-color: transparent; }
tr.pending > td { color: var(--muted); }
tr.pending:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.rk { width: 48px; color: var(--muted); }
.co { display: grid; line-height: 1.3; min-width: 0; }
.co-t { display: flex; align-items: center; gap: 6px; }
.co b { font-weight: 600; color: var(--fg); }
.co small { font-size: 12.5px; color: var(--muted); max-width: 30ch; overflow: hidden; text-overflow: ellipsis; }
.grid td.tp { font-weight: 600; color: var(--fg); }
.ws-cell { display: inline-flex; gap: 8px; font-size: 13px; color: var(--muted); }
.rcell { display: inline-flex; align-items: center; gap: 10px; }
.rcell .rbar { width: 140px; height: auto; }
.rtxt { min-width: 92px; font-size: 12px; color: var(--muted); }
.chev { width: 40px; color: var(--muted); }
.chev svg { display: block; margin-left: auto; }
@media (prefers-reduced-motion: no-preference) { .chev svg { transition: transform .18s; } }
tr.open .chev svg { transform: rotate(90deg); color: var(--accent); }
tr.detail > td { padding: 0; text-align: left; white-space: normal; background: var(--sunk); border-bottom: 1px solid var(--line); }
.empty { padding: 32px 16px !important; text-align: center !important; color: var(--muted); white-space: normal !important; }

/* Row detail */
.dgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; padding: 20px 16px 24px; position: sticky; left: 0; contain: inline-size; }
@media (prefers-reduced-motion: no-preference) { .dgrid { animation: reveal .24s cubic-bezier(.2, .7, .2, 1) both; } }
@keyframes reveal { from { opacity: 0; transform: translateY(-4px); } }
.cases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.splitnote { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0 0 -10px; font-size: 12.5px; color: var(--fg2); }
.case { display: grid; align-content: start; gap: 6px; min-width: 0; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.case.base { border-color: var(--accent-line); box-shadow: inset 0 0 0 1px var(--accent-line); }
.case-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.case-v { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-variant-numeric: tabular-nums; }
.case-v b { font-size: 20px; font-weight: 600; letter-spacing: -.015em; }
.case-v span { font-weight: 600; }
.case p { margin: 0; font-size: 13px; color: var(--fg2); }
.case p.m { font-size: 12.5px; color: var(--muted); }
.dcols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; }
.dsec > h3 { margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 7px 16px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; color: var(--fg2); }
.blk + .blk { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.blk h4 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 6px; }
.blk h4 .src { font-weight: 400; color: var(--muted); }
.blk p { margin: 0 0 6px; font-size: 13px; color: var(--fg2); }
.mix { display: grid; gap: 6px; max-width: 340px; margin-top: 8px; }
.mix-l { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.mix-l b { font-weight: 600; }
.segs { display: flex; gap: 2px; }
.segs i { flex: 1; height: 6px; border-radius: 2px; }
.segs .s { background: var(--down); } .segs .h { background: var(--line2); } .segs .b { background: var(--up); }
.note { font-size: 12px; color: var(--muted); }
.prose { margin: 0; max-width: 80ch; font-size: 13.5px; color: var(--fg2); }
details.more > summary, details.inline > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; width: fit-content; font-size: 13px; font-weight: 500; color: var(--accent); border-radius: 4px; }
details.more > summary::-webkit-details-marker, details.inline > summary::-webkit-details-marker { display: none; }
details.more > summary:hover, details.inline > summary:hover { text-decoration: underline; text-underline-offset: .2em; }
@media (prefers-reduced-motion: no-preference) { details.more > summary svg, details.inline > summary svg { transition: rotate .15s; } }
details[open] > summary svg { rotate: 90deg; }
details.inline { margin-top: 10px; }
details.inline .kv { margin-top: 10px; }
.rsum { display: flex; flex-wrap: wrap; gap: 12px 40px; margin-top: 4px; }
.rsum-c { min-width: 240px; flex: 0 1 340px; }
.rsum-c h4 { margin: 0 0 6px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.rsum-c .mix { margin-top: 0; }
.chg { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 4px; font-size: 13.5px; }
.chg b { font-weight: 600; font-variant-numeric: tabular-nums; }
.dsec h3 .src { margin-left: 8px; font-size: 12px; font-weight: 400; color: var(--muted); }
.hist { margin-top: 12px; overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.hist .grid th { position: static; font-size: 11.5px; }
.hist .grid th, .hist .grid td { padding: 7px 10px; font-size: 12.5px; }
.hist tr.divider td { background: var(--sunk); color: var(--muted); font-size: 11.5px; font-weight: 500; text-align: left; }
.act { display: inline-flex; align-items: center; gap: 7px; }
.act i { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--bg); color: var(--muted); }
.act i.up { color: var(--up); background: var(--up-soft); }
.act i.dn { color: var(--down); background: var(--down-soft); }
.srcs { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 13px; }
.srcs .note { margin-left: 4px; }

/* This week */
.first { margin: 0; padding: 10px 16px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
.wgroup { padding: 12px 0 6px; }
.wgroup + .wgroup { border-top: 1px solid var(--line); }
.wgroup h3 { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 16px 6px; }
.wgroup .hint { margin: -4px 0 4px; padding: 0 16px; font-size: 12px; color: var(--muted); }
.count { font: 500 12px/18px var(--font); color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-variant-numeric: tabular-nums; }
.wgroup ul { list-style: none; margin: 0; padding: 0; }

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("data").textContent);
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const researchText = s => esc(s).replace(/(\d\+?)\s+pp\b/g, "$1%");
  const sgn = (v, d = 1) => { const a = Math.abs(v).toFixed(d); return (+a === 0 ? "" : v >= 0 ? "+" : "−") + a + "%"; };
  const pct = (v, d = 1) => v == null ? '<span class="na">n/a</span>' : `<span class="${v >= 0 ? "pos" : "neg"}">${sgn(v, d)}</span>`;
  const pts = v => v == null ? '<span class="na">n/a</span>' : `<span class="pill ${v >= 0 ? "pos" : "neg"}" title="Change in percentage points">${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(1)} pts</span>`;
  const pill = (v, d = 1) => v == null ? '<span class="na">n/a</span>' : `<span class="pill ${v >= 0 ? "pos" : "neg"}">${sgn(v, d)}</span>`;
  const money = (v, cur) => v == null || v === "" || isNaN(+v) ? "n/a" : (cur && cur !== "USD" ? cur + " " : "$") + Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const capMid = c => c ? (+c.low + +c.high) / 2 : null;
  const cap = c => { const m = capMid(c); return m == null ? "n/a" : m >= 1e12 ? "$" + (m / 1e12).toFixed(2) + "T" : "$" + (m / 1e9).toFixed(0) + "B"; };
  const capRange = c => c ? `$${(c.low / 1e9).toFixed(1)}B – $${(c.high / 1e9).toFixed(1)}B` : "n/a";
  const day = (s, o) => s ? new Date(s.length === 10 ? s + "T12:00:00" : s).toLocaleDateString("en-US", o || { month: "short", day: "numeric", year: "numeric" }) : "n/a";
  const shortDay = s => day(s, { month: "short", day: "numeric" });
  const closeDay = shortDay(D.reference_session);
  const rec = v => { const s = String(v || "").replace(/_/g, " "); return s && s !== "none" ? s[0].toUpperCase() + s.slice(1) : ""; };
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  const ICON = {
    up: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10V2.5M2.5 6 6 2.5 9.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    down: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2v7.5M2.5 6 6 9.5 9.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    same: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h7.5M6.5 3 9.5 6 6.5 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    dot: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="2.4" fill="currentColor"/></svg>',
    arrow: '<svg class="px-arrow" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9.5 4.5 13 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    chev: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5.5 3.5 9 7l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    sortDown: '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 8V2M2.5 5.5 5 8l2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    sortUp: '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 2v6M2.5 4.5 5 2l2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  // Data
  const iss = Object.fromEntries(D.issuers.map(r => [r.symbol, r]));
  const rk = {};
  D.ranked.forEach((r, i) => { rk[r.symbol] = Object.assign({ rank: i + 1 }, r); });
  const elig = D.issuers.filter(r => r.status === "eligible");
  const outside = D.issuers.filter(r => r.status !== "eligible")
    .sort((a, b) => (a.status === "unverified" ? 0 : 1) - (b.status === "unverified" ? 0 : 1) || (b.market_cap_usd?.high || 0) - (a.market_cap_usd?.high || 0));
  const C = D.counts, cutB = D.cutoff_usd / 1e9;
  const X = D.changes || null;
  const prevBase = {};
  ((X && X.base_moves) || []).forEach(m => { prevBase[m.symbol] = m.prev_base; });
  const newThisWeek = new Set(((X && X.previous_session && X.research) || []).filter(r => r.kind === "new").map(r => r.symbol));
  try { localStorage.removeItem("view"); } catch (e) {}

  // Shared scale for every range bar, so rows compare.
  const bears = D.ranked.map(r => r.scenarios_pct.bear), bulls = D.ranked.map(r => r.scenarios_pct.bull);
  const LO = bears.length ? Math.max(-80, Math.floor(Math.min(0, ...bears) / 20) * 20) : -60;
  const HI = bulls.length ? Math.min(240, Math.ceil(Math.max(40, ...bulls) / 20) * 20) : 100;
  function rangeBar(s, prev) {
    const W = 200, H = 20, P = 6, y = H / 2, x = v => (P + (Math.max(LO, Math.min(HI, v)) - LO) / (HI - LO) * (W - 2 * P)).toFixed(1);
    const ghost = prev != null && Math.abs(prev - s.base) >= 0.5 ? `<circle class="ghost" cx="${x(prev)}" cy="${y}" r="4"/>` : "";
    const label = `Bear ${sgn(s.bear, 0)}, base ${sgn(s.base, 0)}, bull ${sgn(s.bull, 0)}${prev != null ? `; last week's base ${sgn(prev, 0)}` : ""}`;
    return `<svg class="rbar" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">
      <line class="track" x1="${P}" x2="${W - P}" y1="${y}" y2="${y}"/><line class="zero" x1="${x(0)}" x2="${x(0)}" y1="1" y2="${H - 1}"/>
      <line class="band" x1="${x(s.bear)}" x2="${x(s.bull)}" y1="${y}" y2="${y}"/>${ghost}
      <circle class="dot ${s.base >= 0 ? "pos" : "neg"}" cx="${x(s.base)}" cy="${y}" r="5"/></svg>`;
  }

  // Analyst target strip: low to high, the average, and the latest close.
  function strip(lo, hi, avg, close, cur, label = "Average") {
    if (lo == null || hi == null || close == null) return "";
    const a = Math.min(lo, close), b = Math.max(hi, close), pad = (b - a) * 0.08 || 1, W = 380, y = 12;
    const x = v => (8 + (v - (a - pad)) / ((b + pad) - (a - pad)) * (W - 16)).toFixed(1);
    return `<svg class="strip" viewBox="0 0 ${W} 24" role="img" aria-label="Targets from ${money(lo, cur)} to ${money(hi, cur)}, average ${money(avg, cur)}, close ${money(close, cur)}">
      <line class="s-track" x1="${x(lo)}" x2="${x(hi)}" y1="${y}" y2="${y}"/><circle class="s-lo" cx="${x(lo)}" cy="${y}" r="3"/><circle class="s-hi" cx="${x(hi)}" cy="${y}" r="3"/>
      ${avg != null ? `<circle class="s-avg" cx="${x(avg)}" cy="${y}" r="5.5"/>` : ""}<line class="s-close" x1="${x(close)}" x2="${x(close)}" y1="${y - 8}" y2="${y + 8}"/>
      </svg>
      <p class="legend"><span><i class="lg-lo"></i>Low ${money(lo, cur)}</span>${avg != null ? `<span><i class="lg-avg"></i>${label} ${money(avg, cur)}</span>` : ""}<span><i class="lg-hi"></i>High ${money(hi, cur)}</span><span><i class="lg-close"></i>Close ${money(close, cur)}</span></p>`;
  }

  // Header
  $("#asof").dateTime = D.reference_session;
  $("#asof").innerHTML = `<span class="asof-k">Prices at the </span>${day(D.reference_session)} close`;
  const upCount = D.ranked.filter(r => r.scenarios_pct.base >= 0).length, negCount = D.ranked.length - upCount;
  $("#lede").innerHTML = `Our 12-month price targets for the ${elig.length} US stocks over $${cutB}B, measured from the ${day(D.reference_session)} close. Research output, not investment advice.`;


  // Top upside cards
  function cards() {
    const top = D.ranked.slice(0, 5);
    if (!top.length) { $("#cards").innerHTML = '<p class="empty">No names have deep research yet. The first batch arrives with the next weekly run.</p>'; return; }
    $("#cards").innerHTML = top.map(r => {
      const s = r.scenarios_pct, i = iss[r.symbol] || {}, prev = prevBase[r.symbol];
      const was = prev != null ? `${s.base >= prev ? "Up" : "Down"} from ${sgn(prev)} last week` : newThisWeek.has(r.symbol) ? "New research this week" : "";
      const cl = money(r.close, i.currency), tg = money(baseTarget(r.symbol), i.currency);
      return `<button type="button" class="card" data-sym="${esc(r.symbol)}" aria-label="${esc(r.symbol)}, ${esc(i.name)}. Our 12-month estimate ${sgn(s.base)}: from the ${closeDay} close of ${cl} to a ${tg} target. Show details">
        <span class="card-top"><span class="tk">${esc(r.symbol)}</span><span class="rank">#${rk[r.symbol].rank}</span></span>
        <span class="card-name">${esc(i.name)}</span>
        <span class="card-k">Our 12-month upside</span>
        <span class="card-v ${s.base >= 0 ? "pos" : "neg"}">${sgn(s.base)}</span>
        <span class="card-px"><span class="px"><small>Close · ${closeDay}</small><b class="px-c">${cl}</b></span>${ICON.arrow}<span class="px"><small>Our target</small><b>${tg}</b></span></span>
        <span class="was">${was}</span>
        ${rangeBar(s, prev)}
        <span class="card-rng"><span>Bear ${sgn(s.bear, 0)}</span><span>Bull ${sgn(s.bull, 0)}</span></span></button>`;
    }).join("");
  }
  $("#cards").addEventListener("click", e => { const b = e.target.closest("[data-sym]"); if (b) showStock(b.dataset.sym); });

  // This week
  function week() {
    const el = $("#week");
    const head = sub => `<div class="panel-head"><div><h2 id="week-title">This week</h2><p class="sub">${sub}</p></div></div>`;
    if (!X) { el.innerHTML = head("No earlier snapshot to compare with yet."); return; }
    const first = !X.previous_session, groups = [];
    const add = (title, items, row, empty, extra) => groups.push(Object.assign({ title, items: items || [], row, empty }, extra));
    const go = sym => `data-sym="${esc(sym)}"`;
    const st = v => esc(String(v).replace("below_cutoff", `below $${cutB}B`).replace("eligible", `above $${cutB}B`).replace("unverified", "unverified cap"));
    const tgt = (v, s) => v == null ? "" : money(v >= 100 ? Math.round(v) : v, (iss[s] || {}).currency).replace(/\.00$/, "");
    const call = c => {
      const parts = [];
      if (c.target != null) {
        const verb = c.direction === "raise" ? "raised to" : c.direction === "cut" ? "cut to" : c.prior_target != null ? "kept at" : "target";
        parts.push(`${verb} <strong>${tgt(c.target, c.symbol)}</strong>${c.prior_target != null && c.direction !== "unchanged" ? " from " + tgt(c.prior_target, c.symbol) : ""}`);
      }
      const changed = c.prior_rating && c.prior_rating !== c.rating;
      if (c.rating && (changed || c.target == null)) parts.push(changed ? `${esc(c.prior_rating)} → <strong>${esc(c.rating)}</strong>` : `<strong>${esc(c.rating)}</strong>`);
      const v = c.revision_pct != null ? pill(c.revision_pct) : `<span class="chip">${esc(c.bucket || "call")}</span>`;
      const tip = `${c.firm} · ${c.analyst} · ${day(c.issued_at)}${c.horizon_months === 12 ? " · 12-month horizon, counts in the weighted target" : " · horizon not documented, excluded from the weighted target"}`;
      return `<button type="button" class="crow" ${go(c.symbol)} title="${esc(tip)}"><b>${esc(c.symbol)}</b><span class="d">${esc(c.firm)}: ${parts.join(", ")}</span><span class="v">${v}</span></button>`;
    };
    if (!first) add("Estimate moves", X.base_moves, m => `<button type="button" class="crow" ${go(m.symbol)}><b>${esc(m.symbol)}</b>
      <span class="d">${sgn(m.prev_base)} → <strong>${sgn(m.base)}</strong> · ${m.re_researched ? "re-researched" : m.price_change_pct != null ? "price " + sgn(m.price_change_pct) : "price move"}</span><span class="v">${pts(m.delta_pp)}</span></button>`,
      "No base case moved.", { hint: "Change in our base case, largest first." });
    add("Analyst calls", X.analyst_calls, call, "No named-analyst actions on researched names this week.", { hint: "Named analysts on researched names." });
    if (!first) add(`Crossed $${cutB}B`, X.crossings, m => `<button type="button" class="crow" ${go(m.symbol)} title="${esc(m.name || "")}"><b>${esc(m.symbol)}</b>
      <span class="d">${st(m.prev_status)} → <strong>${st(m.status)}</strong></span><span class="v num">${cap(m.market_cap_usd)}</span></button>`, "No name entered or left the list.");
    add(first ? "Researched this run" : "Fresh research", X.research, r => `<button type="button" class="chip${r.kind === "new" ? " acc" : ""}" ${go(r.symbol)} title="${esc((iss[r.symbol] || {}).name || "")} · ${r.kind === "new" ? "first research" : "refreshed"}">${esc(r.symbol)}</button>`,
      "No new research this week.", { chips: true, hint: "Blue marks a first research; grey a refresh." });
    if (!first) add("Street targets", X.street_moves, m => `<button type="button" class="crow" ${go(m.symbol)}><b>${esc(m.symbol)}</b>
      <span class="d">avg ${tgt(m.prev_mean, m.symbol)} → <strong>${tgt(m.mean, m.symbol)}</strong>${m.recommendation !== m.prev_recommendation && rec(m.recommendation) ? " · " + esc(rec(m.prev_recommendation) || "none") + " → <strong>" + esc(rec(m.recommendation)) + "</strong>" : ""}</span><span class="v">${pill(m.target_change_pct)}</span></button>`,
      "No average target moved 2% or more.", { hint: "Yahoo Finance average target, moves of 2% or more." });
    const SHOW = 3, CHIPS = 18;
    const body = groups.map(g => {
      const n = g.items.length;
      let h;
      if (!n) h = `<p class="none">${g.empty}</p>`;
      else if (g.chips) { const all = g.items.map(g.row); h = `<div class="syms">${all.slice(0, CHIPS).join("")}</div>${n > CHIPS ? `<details><summary>Show ${n - CHIPS} more</summary><div class="syms">${all.slice(CHIPS).join("")}</div></details>` : ""}`; }
      else { const all = g.items.map(i => `<li>${g.row(i)}</li>`); h = `<ul>${all.slice(0, SHOW).join("")}</ul>${n > SHOW ? `<details><summary>Show ${n - SHOW} more</summary><ul>${all.slice(SHOW).join("")}</ul></details>` : ""}`; }
      return `<section class="wgroup"><h3>${g.title}<span class="count">${n}</span></h3>${n && g.hint ? `<p class="hint">${g.hint}</p>` : ""}${h}</section>`;
    }).join("");
    el.innerHTML = head(first ? `First snapshot · analyst calls since ${day(X.window_start)}` : `${shortDay(X.previous_session)} → ${day(D.reference_session)}`)
      + (first ? '<p class="first">Week-over-week moves start with next Saturday’s run.</p>' : "") + `<div class="week-body">${body}</div>`;
  }
  $("#week").addEventListener("click", e => { const b = e.target.closest("button[data-sym]"); if (b) showStock(b.dataset.sym); });

  // All stocks
  const sectors = [...new Set(elig.map(r => r.sector).filter(Boolean))].sort();
  $("#sector").insertAdjacentHTML("beforeend", sectors.map(s => `<option>${esc(s)}</option>`).join(""));
  const sort = { key: "base", dir: -1 };
  const SORT_LABEL = { co: "company", base: "our upside", street: "the Wall St. average" };
  const GET = { co: r => r.symbol, base: r => rk[r.symbol] ? rk[r.symbol].scenarios_pct.base : null, street: r => (r.aggregate || {}).upside_pct };
  const byRank = (p, q) => ((rk[p.symbol] || {}).rank || 1e9) - ((rk[q.symbol] || {}).rank || 1e9) || p.symbol.localeCompare(q.symbol);
  function ordered(rows) {
    const f = GET[sort.key];
    return rows.slice().sort((p, q) => { const a = f(p), b = f(q);
      if (a == null && b == null) return byRank(p, q); if (a == null) return 1; if (b == null) return -1;
      return (typeof a === "string" ? a.localeCompare(b) : a - b) * sort.dir || byRank(p, q); });
  }
  function matches(r) {
    const q = $("#q").value.trim().toLowerCase(), sec = $("#sector").value;
    if (q && !(r.symbol.toLowerCase().includes(q) || (r.name || "").toLowerCase().includes(q))) return false;
    return !sec || r.sector === sec;
  }
  const th = (key, label, cls, tip) => { const on = sort.key === key;
    return `<th scope="col" class="${cls || ""}"${on ? ` aria-sort="${sort.dir < 0 ? "descending" : "ascending"}"` : ""}><button type="button" class="sortbtn${on ? " on" : ""}" data-key="${key}"${tip ? ` title="${esc(tip)}"` : ""}>${label}${on ? (sort.dir < 0 ? ICON.sortDown : ICON.sortUp) : ""}</button></th>`; };
  const stale = s => s && (new Date(D.reference_session) - new Date(s)) / 864e5 > 120;
  // Our base-case price target (split-adjusted in the build), falling back to close × (1 + base return).
  const baseTarget = sym => { const v = ((D.details[sym] || {}).valuation || {}).base, k = rk[sym];
    return v != null && v !== "" && isFinite(+v) ? +v : k ? k.close * (1 + k.scenarios_pct.base / 100) : null; };
  const street = (a, cur) => a.mean != null || a.upside_pct != null ? `<span class="ws-cell">${a.mean != null ? money(a.mean, cur) : ""}<span>${a.upside_pct != null ? sgn(a.upside_pct) : "n/a"}</span></span>` : '<span class="na">n/a</span>';
  function nameCell(sym, d) {
    const r = iss[sym] || {}, extra = r.other_classes && r.other_classes.length ? ` · also ${r.other_classes.join(", ")}` : "";
    return `<span class="co"><span class="co-t"><b>${esc(sym)}</b>${d && stale(d.researched_at) ? '<span class="chip warn" title="Research is more than 120 days old">stale</span>' : ""}</span><small title="${esc(r.name)}${esc(extra)}">${esc(r.name)}${esc(extra)}</small></span>`;
  }

  let open = null;
  function render() {
    const rows = ordered(elig.filter(matches)), filtered = rows.length !== elig.length;
    $("#stocks-sub").textContent = filtered ? `${rows.length} of ${elig.length} match` : `${elig.length} stocks · ${upCount} with upside, ${negCount} negative${elig.length > D.ranked.length ? ` · ${elig.length - D.ranked.length} awaiting research` : ""}`;
    const empty = elig.length ? "No stocks match. Clear the search or pick another sector." : "No stocks in the list yet.";
    let h = sort.key !== "base" ? `<p class="sortnote">Sorted by ${SORT_LABEL[sort.key]}. The # column keeps our rank by base case.</p>` : "";
    h += `<div class="tablewrap"><table class="grid"><thead><tr><th scope="col" class="rk" title="Our rank by base-case 12-month return">#</th>${th("co", "Company", "l")}<th scope="col" title="Closing price on ${day(D.reference_session)}">Close</th>`
      + `<th scope="col" title="Our base-case price 12 months out">Our target</th>${th("base", "Upside", "", "Our base-case 12-month price return from the close. The default ranking.")}`
      + `<th scope="col" class="l" title="Our bear and bull cases on one shared scale. The dot is the base case; a hollow ring is last week's base case.">Bear to bull</th>`
      + `${th("street", "Wall St. avg", "", "Yahoo Finance average analyst target and its return from the close. A reference only, never blended into ours.")}<th scope="col" class="chev"><span class="sr">Details</span></th></tr></thead><tbody>`;
    if (!rows.length) h += `<tr><td colspan="8" class="empty">${empty}</td></tr>`;
    rows.forEach(r => {
      const k = rk[r.symbol], a = r.aggregate || {}, d = D.details[r.symbol];
      if (!k) { h += `<tr class="pending" data-sym="${esc(r.symbol)}" tabindex="-1"><td class="rk">–</td><td class="l">${nameCell(r.symbol)}</td><td>${money(r.close, r.currency)}</td><td><span class="na">—</span></td><td><span class="chip">Research pending</span></td><td class="l"></td><td>${street(a, r.currency)}</td><td class="chev"></td></tr>`; return; }
      const s = k.scenarios_pct, isOpen = open === r.symbol;
      h += `<tr class="row${isOpen ? " open" : ""}" data-sym="${esc(r.symbol)}" tabindex="-1" aria-expanded="${isOpen}">
        <td class="rk">${k.rank}</td><td class="l">${nameCell(r.symbol, d)}</td><td>${money(k.close, r.currency)}</td><td class="tp">${money(baseTarget(r.symbol), r.currency)}</td><td>${pill(s.base)}</td>
        <td class="l"><span class="rcell">${rangeBar(s, prevBase[r.symbol])}<span class="rtxt">${sgn(s.bear, 0)} to ${sgn(s.bull, 0)}</span></span></td><td>${street(a, r.currency)}</td><td class="chev">${ICON.chev}</td></tr>`;
      if (isOpen) h += `<tr class="detail"><td colspan="8">${detail(k, d || {}, r)}</td></tr>`;
    });
    h += `</tbody></table></div><ol class="mlist">`;
    h += rows.map(r => {
      const k = rk[r.symbol], a = r.aggregate || {}, d = D.details[r.symbol];
      if (!k) return `<li><div class="mrow pending" data-sym="${esc(r.symbol)}" tabindex="-1"><span class="rk">–</span>${nameCell(r.symbol)}<span class="chip">Pending</span><span class="msub"><span>Research pending</span><span>Close ${money(r.close, r.currency)}</span></span></div></li>`;
      const s = k.scenarios_pct, isOpen = open === r.symbol;
      return `<li><button type="button" class="mrow" data-sym="${esc(r.symbol)}" tabindex="-1" aria-expanded="${isOpen}"><span class="rk">${k.rank}</span>${nameCell(r.symbol, d)}<span class="mright">${pill(s.base)}<small>${money(k.close, r.currency)} → <b>${money(baseTarget(r.symbol), r.currency)}</b></small></span>
        <span class="msub">${rangeBar(s, prevBase[r.symbol])}<span>Bear ${sgn(s.bear, 0)} · Bull ${sgn(s.bull, 0)}</span></span></button>${isOpen ? `<div class="mdetail">${detail(k, d || {}, r)}</div>` : ""}</li>`;
    }).join("") || `<li class="empty">${empty}</li>`;
    $("#rows").innerHTML = h + "</ol>";
    $("#sortsel").value = sort.key;
    rove();
    fitDetail();
  }

  // Row detail: cases first, then the evidence behind them.
  const RANK = { Sell: 0, Hold: 1, Buy: 2 };
  function timeline(d) {
    const groups = {};
    (d.history || []).forEach(e => { const k = e.analyst + "|" + e.issued_at.slice(0, 10); (groups[k] = groups[k] || { analyst: e.analyst, firm: e.firm, day: e.issued_at.slice(0, 10) })[e.field] = e; });
    const rows = Object.values(groups).sort((a, b) => (a.day < b.day ? 1 : a.day > b.day ? -1 : 0));
    const earn = d.earnings_at ? d.earnings_at.slice(0, 10) : null;
    let h = "", divided = false;
    const tally = {};
    rows.forEach(g => {
      if (earn && !divided && g.day <= earn) { h += `<tr class="divider"><td colspan="7">Before the last earnings release · ${day(earn)}</td></tr>`; divided = true; }
      const r = g.rating, t = g.target;
      let act = "Reiterated", icon = ICON.same, cls = "";
      if (r && r.prior_observed != null && r.bucket && RANK[r.bucket] != null) {
        const prior = (d.history.find(e => e.field === "rating" && e.analyst === g.analyst && e.value === r.prior_observed) || {}).bucket;
        if (prior && RANK[r.bucket] > RANK[prior]) { act = "Upgrade"; icon = ICON.up; cls = "up"; }
        else if (prior && RANK[r.bucket] < RANK[prior]) { act = "Downgrade"; icon = ICON.down; cls = "dn"; }
      } else if (r && r.prior_observed == null && !t) { act = "First seen"; icon = ICON.dot; }
      else if (!r && t && t.direction) { act = { raise: "Target raised", cut: "Target cut", unchanged: "Target reaffirmed" }[t.direction]; icon = t.direction === "raise" ? ICON.up : t.direction === "cut" ? ICON.down : ICON.same; cls = t.direction === "raise" ? "up" : t.direction === "cut" ? "dn" : ""; }
      else if (!r && t) { act = "First seen"; icon = ICON.dot; }
      if (act === "Reiterated" && t && (t.direction === "raise" || t.direction === "cut")) { act = t.direction === "raise" ? "Target raised" : "Target cut"; icon = t.direction === "raise" ? ICON.up : ICON.down; cls = t.direction === "raise" ? "up" : "dn"; }
      const ratingTxt = r ? (r.prior_observed != null && r.prior_observed !== r.value ? `${esc(r.prior_observed)} → ` : "") + `<b>${esc(r.value)}</b>` : '<span class="na">—</span>';
      const prior = t ? (t.source_prior != null ? t.source_prior : t.prior_observed) : null;
      const tg = t ? (prior != null && prior !== t.value ? `${money(prior)} → ` : "") + `<b>${money(t.value)}</b>` : '<span class="na">—</span>';
      const status = [r, t].filter(Boolean).map(e => e.status_at_cutoff).filter(s => s && s !== "active");
      const src = (t || r).source;
      tally[act] = (tally[act] || 0) + 1;
      h += `<tr><td class="l"><span class="act"><i class="${cls}" aria-hidden="true">${icon}</i>${act}</span></td><td class="l">${ratingTxt}</td>
        <td class="l">${esc(g.analyst)}<br><span class="note">${esc(g.firm)}</span></td><td>${tg}</td><td>${t && t.revision_pct != null ? pct(t.revision_pct) : '<span class="na">—</span>'}</td>
        <td class="l">${day(g.day)}${status.length ? `<br><span class="chip warn" title="Kept in the timeline, left out of the weighted target">${esc(status[0])}</span>` : ""}</td>
        <td class="l">${/^https?:/.test(src) ? `<a href="${esc(src)}" target="_blank" rel="noopener">Source</a>` : esc(src)}</td></tr>`;
    });
    return { n: rows.length, tally, html: `<table class="grid"><thead><tr><th class="l">Action</th><th class="l">Rating</th><th class="l">Analyst</th><th>Target</th><th>Change</th><th class="l">Date</th><th class="l">Source</th></tr></thead><tbody>${h || '<tr><td colspan="7" class="empty">No named analyst calls recorded.</td></tr>'}</tbody></table>` };
  }

  function detail(k, d, r) {
    const v = d.valuation || {}, cs = v.cases || {}, t = d.targets || {}, rt = d.ratings || {}, se = d.sensitivity || {}, a = r.aggregate || {}, cur = r.currency;
    const kv = rows => `<dl class="kv">${rows.filter(Boolean).map(([dt, dd]) => `<dt>${dt}</dt><dd>${dd}</dd>`).join("")}</dl>`;
    const CASE = { bear: "Bear case", base: "Base case", bull: "Bull case" };
    const caseCard = key => { const c = cs[key] || {};
      return `<div class="case ${key}"><div class="case-h"><span>${CASE[key]}</span>${key === "base" ? '<span class="chip acc">Our estimate</span>' : ""}</div>
        <div class="case-v"><b>${money(v[key], cur)}</b>${pct(k.scenarios_pct[key])}</div>${c.driver ? `<p>${researchText(c.driver)}</p>` : ""}${c.assumption ? `<p class="m">${researchText(c.assumption)}</p>` : ""}</div>`; };
    const valuation = kv([
      r.sector && ["Sector", esc(r.sector) + (r.industry ? ` · ${esc(r.industry)}` : "")],
      v.method && ["Method", esc(v.method)],
      v.implied_by_close && ["What the close implies", researchText(v.implied_by_close)],
      v.sensitivity && ["Sensitivity", researchText(v.sensitivity)],
      v.watch_metric && ["What to watch", researchText(v.watch_metric)],
      v.next_disclosure && ["Next report", esc(v.next_disclosure)],
      d.dividend_per_share != null && ["Dividends", `${money(d.dividend_per_share, cur)} expected; base-case total return ${pct(k.base_total_return_pct)}`],
      ["Researched", `${day(d.researched_at)}${d.research_close ? `, from the ${day(d.research_close.close_date)} close of ${money(d.research_close.close, cur)}` : ""}${stale(d.researched_at) ? ' <span class="chip warn">stale</span>' : ""}`],
      ["Market cap", `${cap(r.market_cap_usd)} <span class="note">(range ${capRange(r.market_cap_usd)})</span>`],
      false
    ]);
    const street = `<div class="blk"><h4>Wall St. average <span class="src">Yahoo Finance, fetched ${day(D.fetched_at)}</span></h4>${a.mean != null
      ? `<p><b>${money(a.mean, cur)}</b> · ${pct(a.upside_pct)} from the close · ${a.analysts != null ? a.analysts + " analysts" : "analyst count n/a"}${rec(a.recommendation) ? " · " + esc(rec(a.recommendation)) : ""}</p>${strip(a.low, a.high, a.mean, r.close, cur)}`
      : '<p class="muted">No aggregate target published.</p>'}<p class="note">The provider does not disclose individual analysts, dates or collection windows.</p></div>`;
    const cnt = rt.counts || { Buy: 0, Hold: 0, Sell: 0 }, tot = cnt.Buy + cnt.Hold + cnt.Sell;
    const seg = (n, c) => Array.from({ length: n }, () => `<i class="${c}"></i>`).join("");
    const mix = tot ? `<div class="mix"><div class="mix-l"><span class="neg"><b>${cnt.Sell}</b> Sell</span><span><b>${cnt.Hold}</b> Hold</span><span class="pos"><b>${cnt.Buy}</b> Buy</span></div>
      <div class="segs" aria-hidden="true">${seg(cnt.Sell, "s")}${seg(cnt.Hold, "h")}${seg(cnt.Buy, "b")}</div>${rt.weighted_pct ? `<span class="note">Recency-weighted: ${rt.weighted_pct.Buy.toFixed(0)}% Buy · ${rt.weighted_pct.Hold.toFixed(0)}% Hold · ${rt.weighted_pct.Sell.toFixed(0)}% Sell</span>` : ""}</div>` : "";
    const checks = t.count ? `<details class="inline"><summary>${ICON.chev}Weighting checks</summary>${kv([
      t.range && ["Target range", `${money(t.range[0], cur)} – ${money(t.range[1], cur)}`],
      ["Median age", t.median_age_days != null ? t.median_age_days + " days" : "n/a"],
      ["Largest weight", t.max_weight_pct != null ? t.max_weight_pct.toFixed(0) + "%" : "n/a"],
      ["Since earnings", t.post_earnings != null ? `${t.post_earnings} of ${t.count} updated after ${day(d.earnings_at)}` : "earnings date not recorded"],
      se.equal && ["Equal-weight target", `${money(se.equal.target, cur)} ${pct(se.equal.upside_pct)}`],
      ["Half-life check", `45d ${pct(se["45"] && se["45"].upside_pct)} · 90d ${pct(se["90"] && se["90"].upside_pct)} · 180d ${pct(se["180"] && se["180"].upside_pct)}`]
    ])}</details>` : "";
    const named = `<div class="blk"><h4>Named analysts${d.coverage ? ` <span class="chip" title="Named analysts we could find and date, not the full Street">${d.coverage === "unavailable" ? "coverage unavailable" : esc(d.coverage) + " coverage"}</span>` : ""}</h4>${t.count
      ? `<p>Recency-weighted target <b>${money(t.target, cur)}</b> ${pct(t.upside_pct)} from ${t.count} documented 12-month target${t.count > 1 ? "s" : ""} (90-day half-life).</p>${k.analyst_minus_base_pp != null ? `<p class="note">Gap to our base case: ${k.analyst_minus_base_pp >= 0 ? "+" : "−"}${Math.abs(k.analyst_minus_base_pp).toFixed(1)} pts</p>` : ""}${t.range ? strip(t.range[0], t.range[1], t.target, r.close, cur, "Weighted") : ""}`
      : '<p class="muted">No named target with a documented 12-month horizon, so there is no weighted target.</p>'}${checks}</div>`;
    const tl = timeline(d);
    // Only real changes are tallied: upgrades, downgrades, target raises and cuts.
    const CHG = [["Upgrade", "upgrade", "upgrades", "pos"], ["Downgrade", "downgrade", "downgrades", "neg"], ["Target raised", "target raised", "targets raised", "pos"], ["Target cut", "target cut", "targets cut", "neg"]];
    const chg = CHG.filter(([k]) => tl.tally[k]).map(([k, one, many, c]) => `<span class="${c}"><b>${tl.tally[k]}</b> ${tl.tally[k] > 1 ? many : one}</span>`).join("");
    const ratings = `<section class="dsec"><h3>Analyst ratings <span class="src">Named analysts we could find and date, newest first</span></h3>
      ${!tl.n && !mix ? '<p class="muted">No named analyst ratings or target changes found for this stock.</p>' : `<div class="rsum"><div class="rsum-c"><h4>Current ratings</h4>${mix || '<p class="muted">No mapped ratings.</p>'}</div>
      <div class="rsum-c"><h4>Changes recorded</h4>${chg ? `<p class="chg">${chg}</p>` : '<p class="muted">No upgrades, downgrades or target changes recorded.</p>'}${tl.n ? `<p class="note">${tl.n} analyst action${tl.n > 1 ? "s" : ""} below, including reiterations.</p>` : ""}</div></div>
      <div class="hist">${tl.html}</div>`}</section>`;
    const srcs = (d.sources || []).map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label || s.url)}</a>${s.supports ? `<span class="note">· ${esc(s.supports)}</span>` : ""}</li>`).join("");
    return `<div class="dgrid">
      ${d.split_adjusted ? `<p class="splitnote"><span class="chip warn">Split-adjusted</span>${esc(String(d.split_adjusted.note).replace("valuation text above is", "the case and valuation text is"))}</p>` : ""}
      <div class="cases">${caseCard("bear")}${caseCard("base")}${caseCard("bull")}</div>
      <div class="dcols"><section class="dsec"><h3>Valuation</h3>${valuation}</section><section class="dsec"><h3>Analysts</h3>${street}${named}</section></div>
      ${d.analyst_notes ? `<section class="dsec"><h3>Analyst notes</h3><p class="prose">${researchText(d.analyst_notes)}</p></section>` : ""}
      ${ratings}
      ${srcs ? `<section class="dsec"><h3>Sources</h3><ol class="srcs">${srcs}</ol></section>` : ""}
    </div>`;
  }

  // The detail lives in a wide table row; when the table scrolls sideways, pin it to the visible width.
  function fitDetail() {
    const wrap = $(".stocks .tablewrap"), g = wrap && $(".dgrid", wrap);
    if (!g) return;
    g.style.width = wrap.scrollWidth > wrap.clientWidth + 1 ? Math.max(280, wrap.clientWidth) + "px" : "";
  }
  window.addEventListener("resize", fitDetail);

  // One tab stop for the whole list; arrow keys move within it.
  let cur = null;
  function rove() {
    [$$("#rows tr.row, #rows tr.pending"), $$("#rows .mrow")].forEach(group => {
      if (!group.length) return;
      group.forEach(el => { el.tabIndex = -1; });
      (group.find(el => el.dataset.sym === (cur || open)) || group[0]).tabIndex = 0;
    });
  }
  $("#rows").addEventListener("focusin", e => { const row = e.target.closest("tr.row, tr.pending, .mrow"); if (row && e.target === row && cur !== row.dataset.sym) { cur = row.dataset.sym; rove(); } });
  const visibleRow = sym => $$(`#rows [data-sym="${CSS.escape(sym)}"]`).find(el => el.offsetParent !== null);
  function focusRow(sym, scroll) {
    const el = visibleRow(sym); if (!el) return;
    if (scroll) el.scrollIntoView({ block: "start", behavior: reduced() ? "auto" : "smooth" });
    el.focus({ preventScroll: true });
  }
  function toggle(sym) {
    open = open === sym ? null : sym;
    render();
    focusRow(sym, false);
  }
  function resort(key) {
    if (sort.key === key) sort.dir *= -1; else { sort.key = key; sort.dir = key === "co" ? 1 : -1; }
    render();
    $(`#rows .sortbtn[data-key="${key}"]`)?.focus();
  }
  function step(row, dir) {
    const list = $$("#rows tr.row, #rows tr.pending, #rows .mrow").filter(el => el.offsetParent !== null);
    const next = list[list.indexOf(row) + dir];
    if (!next) return;
    if (open && open === row.dataset.sym && rk[next.dataset.sym]) { open = next.dataset.sym; render(); focusRow(open, false); visibleRow(open)?.scrollIntoView({ block: "nearest" }); return; }
    next.focus(); next.scrollIntoView({ block: "nearest" });
  }
  // Open a stock from anywhere on the page: clear filters that hide it, open its row and bring it into view.
  function showStock(sym) {
    const r = iss[sym];
    if (!r || r.status !== "eligible") {
      const det = $("#outside"); det.open = true;
      const row = document.getElementById("x-" + sym);
      (row || det).scrollIntoView({ block: "center", behavior: reduced() ? "auto" : "smooth" });
      if (row) { $$("#outside tr.hit").forEach(x => x.classList.remove("hit")); row.classList.add("hit"); row.focus({ preventScroll: true }); setTimeout(() => row.classList.remove("hit"), 2600); }
      return;
    }
    if (!matches(r)) { $("#q").value = ""; $("#sector").value = ""; }
    open = rk[sym] ? sym : null;
    render();
    focusRow(sym, true);
  }

  $("#rows").addEventListener("click", e => {
    const sb = e.target.closest(".sortbtn"); if (sb) { resort(sb.dataset.key); return; }
    if (e.target.closest("a, summary, tr.detail, .mdetail")) return;
    const row = e.target.closest("tr.row, button.mrow"); if (row) toggle(row.dataset.sym);
  });
  $("#rows").addEventListener("keydown", e => {
    const row = e.target.closest("tr.row, tr.pending, .mrow");
    if (!row || e.target !== row) return;
    if ((e.key === "Enter" || e.key === " ") && row.matches("tr.row")) { e.preventDefault(); toggle(row.dataset.sym); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); step(row, e.key === "ArrowDown" ? 1 : -1); }
  });
  ["q", "sector"].forEach(id => $("#" + id).addEventListener("input", render));
  $("#sortsel").addEventListener("change", e => { sort.key = e.target.value; sort.dir = sort.key === "co" ? 1 : -1; render(); });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.target.closest("input, select, textarea")) { e.preventDefault(); $("#q").focus(); $("#q").select(); }
    else if (e.key === "Escape") {
      if (e.target === $("#q") && $("#q").value) { $("#q").value = ""; render(); }
      else if (open) { const s = open; open = null; render(); focusRow(s, false); }
    }
  });

  // Methodology and data
  const steps = [[C.listings_checked, "listings screened"], [C.issuers, "issuers"], [C.eligible, `above $${cutB}B`], [C.rank_valued, "valued in depth"], [C.rank_with_named_targets, "with named-analyst targets"]];
  $("#funnel").innerHTML = steps.map(([n, l]) => `<li><b>${n == null ? "n/a" : n}</b><span>${l}</span></li>`).join("");
  $("#method-sub").textContent = `${D.universe}. Updated every Saturday after Friday's close.`;
  $("#mcols").innerHTML = `<div><h3>How the estimates work</h3>
      <p>Eligibility needs a verified whole-company market cap strictly above $${cutB}B (a stricter filter than the stock-upside-analysis skill's $20B floor), one row per issuer, with extra share classes folded in.</p>
      <p>Our bear, base and bull targets are built from filings and stated operating assumptions. Returns are price-only over 12 months unless a dividend line is shown. The list ranks by the unrounded base case, and the range bars share one scale (${sgn(LO, 0)} to ${sgn(HI, 0)}) so rows compare.</p>
      <p>Named-analyst targets count only with a documented 12-month horizon. Each analyst gets one vote, halving with every 90 days of age. Wall St. is the provider's published average, shown as a reference and never blended into our estimate.</p></div>
    <div><h3>Data</h3>
      <p>Universe from the <a href="https://www.nasdaq.com/market-activity/stocks/screener" target="_blank" rel="noopener">Nasdaq stock screener</a>. Closes, shares and average targets from Yahoo Finance via yfinance. Deep research cites its own sources inside each row.</p>
      <p>Prices as of the ${day(D.reference_session)} close. Market data fetched ${day(D.fetched_at)}; page built ${day(D.built_at)}.</p>
      <p>${D.failures.length ? `${D.failures.length} listings failed to load this week. ` : "Every listing loaded this week. "}${D.rejected.length ? `${D.rejected.length} research files were rejected by validation.` : "No research files were rejected."}</p></div>`;
  $("#outside").innerHTML = `<summary>${ICON.chev}Not in the list · ${outside.length} names below $${cutB}B or unverified</summary>
    <p class="note" style="margin:8px 0 0">A cap range is close × shares outstanding, widened to include the screener's figure and ±2% for share-count lag. A range that straddles $${cutB}B is marked unverified rather than guessed.</p>
    <div class="tablewrap" tabindex="0" role="region" aria-label="Stocks not in the list"><table class="grid"><thead><tr><th class="l">Company</th><th class="l">Status</th><th>Price</th><th>Cap range</th><th class="l">Sector</th></tr></thead><tbody>${outside.map(r =>
      `<tr id="x-${esc(r.symbol)}" tabindex="-1"><td class="l">${nameCell(r.symbol)}</td><td class="l"><span class="chip ${r.status === "unverified" ? "warn" : ""}">${r.status === "unverified" ? "unverified" : `below $${cutB}B`}</span></td><td>${money(r.close, r.currency)}</td><td>${capRange(r.market_cap_usd)}</td><td class="l">${esc(r.sector)}</td></tr>`).join("")
      || '<tr><td colspan="5" class="empty">Every screened issuer is in the list.</td></tr>'}</tbody></table></div>`;
  $("#foot").innerHTML = `<p class="disc">Research output, not investment advice. Figures come from public sources and model assumptions that can be wrong.</p><p>Stock Upside Weekly · ${day(D.reference_session)} edition</p>`;

  $("#list-meta").innerHTML = `<p class="legend"><span><i class="lg-band"></i>Bear to bull range</span><span><i class="lg-dot"></i>Base case</span><span><i class="lg-ghost"></i>Last week's base case</span></p>
    <span class="keys"><kbd>↑</kbd><kbd>↓</kbd> move <kbd>Enter</kbd> open <kbd>Esc</kbd> close</span>`;
  if (X) {
    const n = k => (X[k] || []).length, bits = X.previous_session
      ? [[n("base_moves"), "estimate moves"], [n("analyst_calls"), "analyst calls"], [n("crossings"), `crossed $${cutB}B`]]
      : [[n("analyst_calls"), "analyst calls"], [n("research"), "researched"]];
    const jump = $("#week-jump");
    jump.innerHTML = `<span>This week: ${bits.map(([v, l], i) => `<span class="nw"><b>${v}</b> ${l}${i < bits.length - 1 ? " ·" : ""}</span>`).join(" ")}</span><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2.5v9M3.5 8 7 11.5 10.5 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    jump.hidden = false;
  }

  // Current section in the top bar.
  const navLinks = $$(".nav a");
  function spy() {
    const ids = innerWidth > 1180 ? ["top", "stocks", "method"] : ["top", "stocks", "week", "method"];
    const line = $(".bar").getBoundingClientRect().bottom + 24;
    let active = "top";
    ids.forEach(id => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top <= line) active = id; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) active = "method";
    navLinks.forEach(a => { if (a.getAttribute("href") === "#" + active) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current"); });
  }
  let spyQueued = false;
  addEventListener("scroll", () => { if (!spyQueued) { spyQueued = true; requestAnimationFrame(() => { spyQueued = false; spy(); }); } }, { passive: true });
  addEventListener("resize", spy);

  cards();
  week();
  render();
  spy();
})();
</script>
